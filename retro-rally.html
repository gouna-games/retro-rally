        velocityBY -= impulse * normalY * inverseMassB;

        const postRelativeX = velocityAX - velocityBX;
        const postRelativeY = velocityAY - velocityBY;
        const normalComponent = postRelativeX * normalX + postRelativeY * normalY;
        let tangentX = postRelativeX - normalComponent * normalX;
        let tangentY = postRelativeY - normalComponent * normalY;
        const tangentLength = Math.hypot(tangentX, tangentY);
        if (tangentLength > 0.001) {
          tangentX /= tangentLength;
          tangentY /= tangentLength;
          const relativeTangentSpeed = postRelativeX * tangentX + postRelativeY * tangentY;
          const rawFrictionImpulse = -relativeTangentSpeed / inverseMassTotal;
          const maxFrictionImpulse = Math.abs(impulse) * COLLISION_FRICTION;
          const frictionImpulse = Math.max(
            -maxFrictionImpulse,
            Math.min(maxFrictionImpulse, rawFrictionImpulse),
          );
          velocityAX += frictionImpulse * tangentX * inverseMassA;
          velocityAY += frictionImpulse * tangentY * inverseMassA;
          velocityBX -= frictionImpulse * tangentX * inverseMassB;
          velocityBY -= frictionImpulse * tangentY * inverseMassB;
        }

        projectVelocityToCar(a, velocityAX, velocityAY);
        projectVelocityToCar(b, velocityBX, velocityBY);
        if (incomingSpeedA > 30) {
          a.car.speed = Math.max(a.car.speed, incomingSpeedA * COLLISION_SPEED_RETENTION);
        }
        if (incomingSpeedB > 30) {
          b.car.speed = Math.max(b.car.speed, incomingSpeedB * COLLISION_SPEED_RETENTION);
        }
        a.car.bump = 1;
        b.car.bump = 1;
      }

      function resolveCarCollisions() {
        const resolvedPairs = new Set();
        const contactsThisFrame = new Set();

        for (let iteration = 0; iteration < COLLISION_ITERATIONS; iteration += 1) {
          let foundOverlap = false;
          for (let i = 0; i < cars.length; i += 1) {
            for (let j = i + 1; j < cars.length; j += 1) {
              const a = cars[i];
              const b = cars[j];
              if (a.finished || b.finished || a.airborne || b.airborne) continue;
              if (Boolean(a.shortcutId) !== Boolean(b.shortcutId)) continue;
              const bodyA = getCarBody(a);
              const bodyB = getCarBody(b);
              const collision = findBodyCollision(bodyA, bodyB);
              if (!collision) continue;

              foundOverlap = true;
              const pairKey = `${i}:${j}`;
              contactsThisFrame.add(pairKey);
              const correction = Math.max(0, collision.penetration - 0.02) * 0.52 + 0.01;
              const inverseMassA = a.isPlayer ? 0.34 : 1;
              const inverseMassB = b.isPlayer ? 0.34 : 1;
              const inverseMassTotal = inverseMassA + inverseMassB;
              const correctionA = correction * inverseMassA / inverseMassTotal * 2;
              const correctionB = correction * inverseMassB / inverseMassTotal * 2;

              applyWorldCorrection(
                a,
                bodyA.position,
                collision.normalX * correctionA,
                collision.normalY * correctionA,
              );
              applyWorldCorrection(
                b,
                bodyB.position,
                -collision.normalX * correctionB,
                -collision.normalY * correctionB,
              );

              if (!resolvedPairs.has(pairKey) && !activeCollisionPairs.has(pairKey)) {
                applyCollisionImpulse(bodyA, bodyB, collision.normalX, collision.normalY);
                resolvedPairs.add(pairKey);
              }

              const pushA = collision.normalX * bodyA.sideX + collision.normalY * bodyA.sideY;
              const pushB = -collision.normalX * bodyB.sideX - collision.normalY * bodyB.sideY;
              const steeringNudge = Math.min(2.5, collision.penetration * 0.14);
              if (!a.isPlayer) a.laneTarget = Math.max(-33, Math.min(33, a.laneTarget + pushA * steeringNudge));
              if (!b.isPlayer) b.laneTarget = Math.max(-33, Math.min(33, b.laneTarget + pushB * steeringNudge));
            }
          }
          if (!foundOverlap) break;
        }
        activeCollisionPairs = contactsThisFrame;
      }

      function updateRanks() {
        const ordered = [...cars].sort((a, b) => {
          if (a.finished && b.finished) return a.finishTime - b.finishTime;
          if (a.finished) return -1;
          if (b.finished) return 1;
          return b.progress - a.progress;
        });
        ordered.forEach((car, index) => { car.rank = index + 1; });
      }

      function emitWaterSplash(position, speed, material = "water") {
        const rearX = position.x - Math.cos(position.angle) * 8;
        const rearY = position.y - Math.sin(position.angle) * 8;
        const color = material === "mud" ? "105, 76, 48" : "164, 224, 242";
        for (let i = 0; i < 7; i += 1) {
          const side = (Math.random() - 0.5) * 2;
          particles.push({
            x: rearX + position.nx * side * 8,
            y: rearY + position.ny * side * 8,
            vx: -Math.cos(position.angle) * (18 + speed * 0.16) + position.nx * side * (24 + Math.random() * 28),
            vy: -42 - Math.random() * 52 + Math.sin(position.angle) * 8,
            life: 0.38 + Math.random() * 0.28,
            maxLife: 0.66,
            size: 1.5 + Math.random() * 2.8,
            color,
            type: "splash",
          });
        }
        if (particles.length > 380) particles.splice(0, particles.length - 380);
      }

      function surfaceMaterialAt(car, wrappedProgress) {
        const map = MAPS[currentMapIndex];
        if (car.shortcutId) {
          if (map.id === "frostbite") return "snow";
          if (map.id === "dune-dash") return "sand";
          if (map.id === "jungle-jolt") return "earth";
          return "dirt";
        }
        const obstacle = map.obstacles.find((candidate) =>
          !car.airborne && isTouchingObstacle(car, wrappedProgress, candidate));
        if (obstacle) {
          if (obstacle.type === "puddle" || obstacle.type === "mud") return null;
          if (obstacle.type === "ice") return "ice";
          if (obstacle.type === "sand") return "sand";
          if (obstacle.type === "rocky") return "gravel";
          if (obstacle.type === "construction") return "construction";
        }
        if (map.id === "frostbite") return "snow";
        if (map.id === "dune-dash") return "sand";
        if (map.id === "jungle-jolt") return "earth";
        return "dirt";
      }

      function emitSurfaceTrail(car, wrappedProgress, speed, burstScale = 1) {
        const material = surfaceMaterialAt(car, wrappedProgress);
        if (!material) return;
        emitTrailParticles(getCarPosition(car), speed, material, burstScale);
      }

      function emitTrailParticles(position, speed, material, burstScale = 1) {
        const styles = {
          dirt: { colors: ["#c78345", "#8b542f"], shape: "chunk", size: 3 },
          earth: { colors: ["#8f623b", "#5f3f2b"], shape: "chunk", size: 3 },
          sand: { colors: ["#f0cc86", "#c98b4c", "#e5b46a"], shape: "grain", size: 2 },
          snow: { colors: ["#f7fdff", "#cfe8f2", "#a9cddd"], shape: "flake", size: 2 },
          ice: { colors: ["#e9fbff", "#9ed8ed", "#c8eff8"], shape: "shard", size: 1.5 },
          gravel: { colors: ["#aaa08f", "#676b68", "#817969"], shape: "chunk", size: 2 },
          construction: { colors: ["#d8a059", "#8f6032"], shape: "chunk", size: 3 },
        };
        const style = styles[material];
        const rearX = position.x - Math.cos(position.angle) * 14;
        const rearY = position.y - Math.sin(position.angle) * 14;
        const count = Math.max(2, Math.round(4 * burstScale));
        for (let i = 0; i < count; i += 1) {
          const side = i % 2 ? 1 : -1;
          const life = (material === "snow" ? 0.62 : 0.48) + Math.random() * 0.3;
          const speedSpread = Math.min(1, speed / 130);
          particles.push({
            x: rearX + position.nx * (side * 7 + (Math.random() - 0.5) * 5),
            y: rearY + position.ny * (side * 7 + (Math.random() - 0.5) * 5),
            vx: -Math.cos(position.angle) * (18 + speed * 0.13) + position.nx * (Math.random() - 0.5) * (22 + speedSpread * 22),
            vy: -Math.sin(position.angle) * (18 + speed * 0.13) + position.ny * (Math.random() - 0.5) * (22 + speedSpread * 22),
            life,
            maxLife: life,
            size: style.size + Math.random() * (material === "snow" ? 3 : 2.5),
            shade: style.colors[Math.floor(Math.random() * style.colors.length)],
            shape: style.shape,
            type: "trail",
          });
        }
        if (particles.length > 620) particles.splice(0, particles.length - 620);
      }

      function updateParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i -= 1) {
          const particle = particles[i];
          particle.life -= dt;
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          if (particle.type === "splash") {
            particle.vx *= 0.985;
            particle.vy += 175 * dt;
          } else {
            particle.vx *= 0.965;
            particle.vy *= 0.965;
            particle.size += dt * 5;
          }
          if (particle.life <= 0) particles.splice(i, 1);
        }
      }

      function traceTrackPath() {
        ctx.beginPath();
        ctx.moveTo(track[0].x, track[0].y);
        for (let i = 1; i < track.length; i += 1) ctx.lineTo(track[i].x, track[i].y);
        ctx.closePath();
      }

      function traceOffsetPath(offset) {
        ctx.beginPath();
        ctx.moveTo(track[0].x + track[0].nx * offset, track[0].y + track[0].ny * offset);
        for (let i = 1; i < track.length; i += 1) {
          ctx.lineTo(track[i].x + track[i].nx * offset, track[i].y + track[i].ny * offset);
        }
        ctx.closePath();
      }

      function drawBackground() {
        const gradient = ctx.createLinearGradient(0, 0, 0, viewHeight);
        gradient.addColorStop(0, "#4e7b34");
        gradient.addColorStop(0.55, "#315e2d");
        gradient.addColorStop(1, "#183b25");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, viewWidth, viewHeight);

        scenerySeed = 4242;
        for (let i = 0; i < 260; i += 1) {
          const x = seededRandom() * viewWidth;
          const y = 90 + seededRandom() * (viewHeight - 90);
          const size = 1 + seededRandom() * 3.5;
          ctx.fillStyle = seededRandom() > 0.55 ? "rgba(172,199,91,0.28)" : "rgba(20,55,25,0.3)";
          ctx.fillRect(x, y, size, size);
        }

        drawGroundScenery();
      }

      function drawMapBase() {
        if (mapReady) {
          ctx.drawImage(activeMapImage, 0, 0, GAME_WIDTH, GAME_HEIGHT);
        } else {
          ctx.fillStyle = MAPS[currentMapIndex].id === "frostbite" ? "#c7d8e4" : "#315e2d";
          ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        }

        if (!MAPS[currentMapIndex].bakedTrack) drawTrack();
      }

      function tracePondRoute(context, samples, closed = true) {
        if (samples.length < 2) return;
        context.beginPath();
        context.moveTo(samples[0].x, samples[0].y);
        for (let index = 1; index < samples.length; index += 1) {
          context.lineTo(samples[index].x, samples[index].y);
        }
        if (closed) context.closePath();
      }

      function drawJunglePonds() {
        if (MAPS[currentMapIndex].id !== "jungle-jolt" || track.length < 2) return;

        pondCtx.setTransform(1, 0, 0, 1, 0, 0);
        pondCtx.globalCompositeOperation = "source-over";
        pondCtx.globalAlpha = 1;
        pondCtx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        const water = pondCtx.createLinearGradient(0, 90, GAME_WIDTH, GAME_HEIGHT - 80);
        water.addColorStop(0, "rgba(42, 119, 84, 0.28)");
        water.addColorStop(0.52, "rgba(25, 91, 66, 0.34)");
        water.addColorStop(1, "rgba(13, 66, 54, 0.4)");
        pondCtx.fillStyle = water;
        pondCtx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        const greenCenter = pondCtx.createRadialGradient(
          GAME_WIDTH * 0.5,
          GAME_HEIGHT * 0.5,
          18,
          GAME_WIDTH * 0.5,
          GAME_HEIGHT * 0.5,
          330,
        );
        greenCenter.addColorStop(0, "rgba(58, 139, 76, 0.2)");
        greenCenter.addColorStop(0.48, "rgba(37, 116, 69, 0.12)");
        greenCenter.addColorStop(1, "rgba(21, 82, 61, 0)");
        pondCtx.fillStyle = greenCenter;
        pondCtx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        pondCtx.lineWidth = 1;
        for (let index = 0; index < 18; index += 1) {
          const y = 118 + index * 43 + Math.sin(raceTime * 0.7 + index) * 5;
          pondCtx.strokeStyle = index % 2
            ? "rgba(116, 197, 151, 0.09)"
            : "rgba(121, 218, 207, 0.11)";
          pondCtx.beginPath();
          pondCtx.moveTo(18, y);
          for (let x = 18; x <= GAME_WIDTH - 18; x += 22) {
            pondCtx.lineTo(x, y + Math.sin(x * 0.035 + raceTime * 1.2 + index) * 2.5);
          }
          pondCtx.stroke();
        }

        for (let index = 0; index < 58; index += 1) {
          const x = 20 + ((index * 83 + 31) % (GAME_WIDTH - 40));
          const y = 105 + ((index * 137 + 47) % (GAME_HEIGHT - 190));
          const glint = Math.max(0, Math.sin(raceTime * (1.5 + index % 4 * 0.17) + index * 2.37));
          const alpha = glint ** 7;
          if (alpha < 0.04) continue;
          const size = 1.2 + index % 3 * 0.65;
          pondCtx.strokeStyle = `rgba(190, 255, 215, ${alpha * 0.75})`;
          pondCtx.lineWidth = 0.7 + alpha;
          pondCtx.beginPath();
          pondCtx.moveTo(x - size, y);
          pondCtx.lineTo(x + size, y);
          pondCtx.moveTo(x, y - size);
          pondCtx.lineTo(x, y + size);
          pondCtx.stroke();
        }

        for (let index = 0; index < 18; index += 1) {
          const x = 25 + ((index * 109 + 53) % (GAME_WIDTH - 50));
          const y = 120 + ((index * 173 + 29) % (GAME_HEIGHT - 220));
          const drift = Math.sin(raceTime * 0.55 + index * 1.8) * 1.8;
          const radius = 3.2 + index % 3;
          pondCtx.fillStyle = "rgba(31, 115, 79, 0.82)";
          pondCtx.beginPath();
          pondCtx.ellipse(x + drift, y, radius * 1.25, radius * 0.75, index * 0.7, 0, TAU);
          pondCtx.fill();
          const flowerColor = index % 3 === 0 ? "#f6d0dc" : index % 3 === 1 ? "#f4efb0" : "#c8d7ff";
          pondCtx.fillStyle = flowerColor;
          for (let petal = 0; petal < 5; petal += 1) {
            const angle = petal / 5 * TAU + raceTime * 0.08;
            pondCtx.beginPath();
            pondCtx.arc(x + drift + Math.cos(angle) * 2.2, y + Math.sin(angle) * 2.2, 1.35, 0, TAU);
            pondCtx.fill();
          }
          pondCtx.fillStyle = "#f4b942";
          pondCtx.beginPath();
          pondCtx.arc(x + drift, y, 1.25, 0, TAU);
          pondCtx.fill();
        }

        pondCtx.globalCompositeOperation = "destination-in";
        pondCtx.fillStyle = "#000";
        tracePondRoute(pondCtx, track);
        pondCtx.fill("evenodd");

        pondCtx.globalCompositeOperation = "destination-out";
        pondCtx.strokeStyle = "#000";
        pondCtx.lineJoin = "round";
        pondCtx.lineCap = "round";
        pondCtx.lineWidth = (MAPS[currentMapIndex].trackWidth || TRACK_WIDTH) + 10;
        tracePondRoute(pondCtx, track);
        pondCtx.stroke();
        for (const shortcut of shortcutTracks) {
          pondCtx.lineWidth = shortcut.width + 10;
          tracePondRoute(pondCtx, shortcut.samples, false);
          pondCtx.stroke();
        }

        pondCtx.globalCompositeOperation = "source-over";
        ctx.drawImage(pondCanvas, 0, 0);
      }

      function drawGroundScenery() {
        for (const item of sceneryObjects) {
          ctx.save();
          ctx.translate(item.x, item.y);
          ctx.scale(item.scale, item.scale);

          if (item.type === "tree") {
            ctx.fillStyle = "rgba(0,0,0,0.18)";
            ctx.beginPath();
            ctx.ellipse(4, 8, 15, 7, 0, 0, TAU);
            ctx.fill();
            ctx.fillStyle = "#654321";
            ctx.fillRect(-2, -2, 5, 15);
            ctx.fillStyle = item.shade > 0.5 ? "#285b2b" : "#347334";
            ctx.beginPath();
            ctx.arc(-7, -7, 11, 0, TAU);
            ctx.arc(6, -10, 13, 0, TAU);
            ctx.arc(1, -20, 11, 0, TAU);
            ctx.fill();
            ctx.fillStyle = "rgba(126,173,72,0.42)";
            ctx.beginPath();
            ctx.arc(-2, -15, 7, 0, TAU);
            ctx.fill();
          } else if (item.type === "bush") {
            ctx.fillStyle = "rgba(0,0,0,0.16)";
            ctx.beginPath();
            ctx.ellipse(2, 5, 12, 5, 0, 0, TAU);
            ctx.fill();
            ctx.fillStyle = item.shade > 0.5 ? "#397a35" : "#2d672f";
            ctx.beginPath();
            ctx.arc(-7, 0, 7, 0, TAU);
            ctx.arc(0, -5, 8, 0, TAU);
            ctx.arc(8, 0, 7, 0, TAU);
            ctx.fill();
          } else if (item.type === "rock") {
            ctx.fillStyle = "rgba(0,0,0,0.18)";
            ctx.beginPath();
            ctx.ellipse(3, 5, 10, 4, 0, 0, TAU);
            ctx.fill();
            ctx.fillStyle = item.shade > 0.5 ? "#8c9188" : "#6f776f";
            ctx.beginPath();
            ctx.moveTo(-9, 4);
            ctx.lineTo(-5, -6);
            ctx.lineTo(4, -10);
            ctx.lineTo(10, -2);
            ctx.lineTo(7, 6);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,0.2)";
            ctx.stroke();
          } else {
            const colors = ["#f6d447", "#f58d5d", "#e9e4ba", "#7dc7e7"];
            for (let i = 0; i < 5; i += 1) {
              const angle = i * 2.4;
              ctx.fillStyle = colors[(i + Math.floor(item.shade * 4)) % colors.length];
              ctx.fillRect(Math.cos(angle) * 8, Math.sin(angle) * 5, 3, 3);
            }
          }
          ctx.restore();
        }
      }

      function drawTrack() {
        const [edgeColor, shoulderColor, roadColor, highlightColor] = MAPS[currentMapIndex].trackColors;
        traceTrackPath();
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.strokeStyle = edgeColor;
        ctx.lineWidth = TRACK_WIDTH + 20;
        ctx.stroke();

        traceTrackPath();
        ctx.strokeStyle = shoulderColor;
        ctx.lineWidth = TRACK_WIDTH + 10;
        ctx.stroke();

        traceTrackPath();
        ctx.strokeStyle = roadColor;
        ctx.lineWidth = TRACK_WIDTH;
        ctx.stroke();

        traceTrackPath();
        ctx.strokeStyle = highlightColor;
        ctx.lineWidth = TRACK_WIDTH - 10;
        ctx.stroke();

        drawTrackEdgeBands();
      }

      function drawTrackEdgeBands() {
        ctx.save();
        ctx.lineJoin = "round";
        for (const side of [-1, 1]) {
          traceOffsetPath(side * (TRACK_WIDTH / 2 + 1));
          ctx.strokeStyle = "#252a20";
          ctx.lineWidth = 6;
          ctx.stroke();

          traceOffsetPath(side * (TRACK_WIDTH / 2 + 1));
          ctx.setLineDash([1, 8]);
          ctx.lineCap = "round";
          ctx.strokeStyle = "#b8ad7d";
          ctx.lineWidth = 2.4;
          ctx.stroke();
          ctx.setLineDash([]);
        }
        ctx.restore();
      }

      function drawStartLine() {
        if (MAPS[currentMapIndex].bakedTrack) return;
        const start = pathAt(0);
        ctx.save();
        ctx.translate(start.x, start.y);
        ctx.rotate(start.angle);
        const cell = 8;
        for (let row = -5; row <= 4; row += 1) {
          for (let column = -1; column <= 1; column += 1) {
            ctx.fillStyle = (row + column) % 2 === 0 ? "#f9f4df" : "#252525";
            ctx.fillRect(column * cell, row * cell, cell, cell);
          }
        }
        ctx.restore();
      }

      function drawTrackObjects() {
        if (MAPS[currentMapIndex].bakedTrack) return;
        const rocky = pathAt(ROCKY_GROUND.progress, 0);
        ctx.save();
        ctx.translate(rocky.x, rocky.y);
        ctx.rotate(rocky.angle);
        ctx.fillStyle = "rgba(91,76,59,0.72)";
        ctx.beginPath();
        ctx.roundRect(
          -ROCKY_GROUND.halfLength,
          -ROCKY_GROUND.halfWidth,
          ROCKY_GROUND.halfLength * 2,
          ROCKY_GROUND.halfWidth * 2,
          9,
        );
        ctx.fill();
        const rockSpots = [
          [-24, -25, 3], [-20, 8, 4], [-13, 29, 3], [-7, -12, 3], [0, 18, 4],
          [6, -31, 3], [12, -4, 4], [18, 27, 3], [24, -20, 4], [27, 9, 3],
        ];
        for (const [x, y, radius] of rockSpots) {
          ctx.fillStyle = "rgba(51,48,43,0.78)";
          ctx.beginPath();
          ctx.ellipse(x, y, radius + 1, radius, -0.35, 0, TAU);
          ctx.fill();
          ctx.fillStyle = "rgba(188,164,126,0.48)";
          ctx.beginPath();
          ctx.ellipse(x - 1, y - 1, radius * 0.55, radius * 0.35, -0.35, 0, TAU);
          ctx.fill();
        }
        ctx.restore();

        const construction = pathAt(CONSTRUCTION_ZONE.progress, 0);
        ctx.save();
        ctx.translate(construction.x, construction.y);
        ctx.rotate(construction.angle);
        ctx.fillStyle = "rgba(150,105,50,0.82)";
        ctx.beginPath();
        ctx.roundRect(
          -CONSTRUCTION_ZONE.halfLength,
          -CONSTRUCTION_ZONE.halfWidth,
          CONSTRUCTION_ZONE.halfLength * 2,
          CONSTRUCTION_ZONE.halfWidth * 2,
          8,
        );
        ctx.fill();
        ctx.fillStyle = "rgba(221,164,80,0.72)";
        ctx.fillRect(
          -CONSTRUCTION_ZONE.halfLength,
          CONSTRUCTION_ZONE.clearLane - CONSTRUCTION_ZONE.clearHalfWidth,
          CONSTRUCTION_ZONE.halfLength * 2,
          CONSTRUCTION_ZONE.clearHalfWidth * 2,
        );
        ctx.strokeStyle = "rgba(255,224,142,0.68)";
        ctx.lineWidth = 2;
        ctx.setLineDash([7, 6]);
        for (const edge of [-1, 1]) {
          const lane = CONSTRUCTION_ZONE.clearLane + edge * CONSTRUCTION_ZONE.clearHalfWidth;
          ctx.beginPath();
          ctx.moveTo(-CONSTRUCTION_ZONE.halfLength, lane);
          ctx.lineTo(CONSTRUCTION_ZONE.halfLength, lane);
          ctx.stroke();
        }
        ctx.setLineDash([]);
        ctx.fillStyle = "rgba(105,68,31,0.54)";
        for (const lane of [-31, -16, 2, 36]) {
          ctx.fillRect(-CONSTRUCTION_ZONE.halfLength + 5, lane - 2, CONSTRUCTION_ZONE.halfLength * 2 - 10, 3);
        }
        ctx.restore();

        const ramp = pathAt(RAMP.progress, 0);
        ctx.save();
        ctx.translate(ramp.x, ramp.y);
        ctx.rotate(ramp.angle);
        const rampGradient = ctx.createLinearGradient(-RAMP.halfLength, 0, RAMP.halfLength, 0);
        rampGradient.addColorStop(0, "#6d4a2e");
        rampGradient.addColorStop(0.62, "#b17b42");
        rampGradient.addColorStop(1, "#e0aa5d");
        ctx.fillStyle = rampGradient;
        ctx.beginPath();
        ctx.moveTo(-RAMP.halfLength, -RAMP.halfWidth);
        ctx.lineTo(RAMP.halfLength, -RAMP.halfWidth + 5);
        ctx.lineTo(RAMP.halfLength, RAMP.halfWidth - 5);
        ctx.lineTo(-RAMP.halfLength, RAMP.halfWidth);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "#44301f";
        ctx.lineWidth = 3;
        ctx.stroke();
        for (let x = -RAMP.halfLength + 4; x < RAMP.halfLength; x += 7) {
          ctx.strokeStyle = x > 5 ? "rgba(255,226,151,0.62)" : "rgba(49,31,18,0.55)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x, -RAMP.halfWidth + 3);
          ctx.lineTo(x, RAMP.halfWidth - 3);
          ctx.stroke();
        }
        for (const lane of [-11, 0, 11]) {
          ctx.fillStyle = "rgba(255,240,178,0.8)";
          ctx.beginPath();
          ctx.moveTo(10, lane - 5);
          ctx.lineTo(17, lane);
          ctx.lineTo(10, lane + 5);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();

        const mud = pathAt(MUD_PIT.progress, 0);
        ctx.save();
        ctx.translate(mud.x, mud.y);
        ctx.rotate(mud.angle);
        ctx.fillStyle = "rgba(74,45,24,0.88)";
        ctx.beginPath();
        ctx.ellipse(0, 0, MUD_PIT.halfLength + 4, MUD_PIT.halfWidth + 3, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = "rgba(70,79,65,0.78)";
        ctx.beginPath();
        ctx.ellipse(-4, 0, MUD_PIT.halfLength - 2, MUD_PIT.halfWidth - 4, 0, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = "rgba(163,189,174,0.42)";
        ctx.lineWidth = 2;
        for (const lane of [-16, 0, 16]) {
          ctx.beginPath();
          ctx.ellipse(2, lane, MUD_PIT.halfLength - 12, 5, 0, Math.PI * 1.08, Math.PI * 1.88);
          ctx.stroke();
        }
        ctx.fillStyle = "rgba(42,30,19,0.42)";
        for (const [x, y, radius] of [[-20, -9, 3], [-11, 13, 4], [4, -15, 3], [14, 10, 4], [21, -5, 2]]) {
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, TAU);
          ctx.fill();
        }
        ctx.restore();

        const icyPatches = Boolean(MAPS[currentMapIndex].slippery);
        const sandyPatches = MAPS[currentMapIndex].id === "dune-dash";
        for (const [progress, lane] of PUDDLES) {
          const p = pathAt(progress, lane);
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);
          ctx.fillStyle = icyPatches
            ? "rgba(88,129,155,0.5)"
            : sandyPatches ? "rgba(111,67,34,0.38)" : "rgba(49,74,76,0.35)";
          ctx.beginPath();
          ctx.ellipse(3, 3, PUDDLE_HALF_LENGTH + 3, PUDDLE_HALF_WIDTH + 2, 0, 0, TAU);
          ctx.fill();
          ctx.fillStyle = icyPatches
            ? "rgba(177,220,237,0.86)"
            : sandyPatches ? "rgba(177,111,52,0.78)" : "rgba(68,122,139,0.78)";
          ctx.beginPath();
          ctx.ellipse(0, 0, PUDDLE_HALF_LENGTH, PUDDLE_HALF_WIDTH, 0, 0, TAU);
          ctx.fill();
          ctx.strokeStyle = icyPatches
            ? "rgba(239,251,255,0.9)"
            : sandyPatches ? "rgba(242,190,112,0.6)" : "rgba(194,226,225,0.55)";
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.strokeStyle = "rgba(255,255,255,0.28)";
          ctx.beginPath();
          ctx.ellipse(-7, -3, 16, 6, 0, Math.PI * 1.05, Math.PI * 1.85);
          ctx.stroke();
          ctx.restore();
        }

        if (MAPS[currentMapIndex].bakedTrack) {
          const barrelPoints = [[0.23, -65], [0.52, 66], [0.83, -67]];
          for (const [progress, lane] of barrelPoints) {
            const p = pathAt(progress, lane);
            for (let i = 0; i < 3; i += 1) {
              ctx.save();
              ctx.translate(p.x + Math.cos(p.angle) * (i - 1) * 11, p.y + Math.sin(p.angle) * (i - 1) * 11);
              ctx.fillStyle = i % 2 ? "#3b71a7" : "#d84c3d";
              ctx.beginPath();
              ctx.ellipse(0, 0, 5, 7, 0, 0, TAU);
              ctx.fill();
              ctx.strokeStyle = "rgba(255,255,255,0.5)";
              ctx.beginPath();
              ctx.moveTo(-5, -2);
              ctx.lineTo(5, -2);
              ctx.moveTo(-5, 3);
              ctx.lineTo(5, 3);
              ctx.stroke();
              ctx.restore();
            }
          }
        }

        if (MAPS[currentMapIndex].bakedTrack) {
          for (const progress of [0.18, 0.55, 0.93]) {
            const p = pathAt(progress, 37);
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.fillStyle = "#f28a31";
            ctx.beginPath();
            ctx.moveTo(0, -8);
            ctx.lineTo(-5, 6);
            ctx.lineTo(5, 6);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = "#f3e4bf";
            ctx.fillRect(-4, 0, 8, 2);
            ctx.restore();
          }
        }
      }

      function drawScenery() {
        if (MAPS[currentMapIndex].bakedTrack) return;

        const flagPoints = [0.02, 0.13, 0.21, 0.32, 0.41, 0.54, 0.63, 0.74, 0.84, 0.94];
        flagPoints.forEach((progress, index) => {
          const p = pathAt(progress, index % 2 === 0 ? -78 : 78);
          const wave = Math.sin(raceTime * 5.2 + index * 1.7);
          const tipWave = Math.sin(raceTime * 7.1 + index * 2.3) * 3;
          const flagLength = 16 + wave * 2;
          ctx.strokeStyle = "#d9dfd9";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x, p.y - 29);
          ctx.stroke();
          ctx.fillStyle = index % 2 ? "#f1ca3d" : "#df493a";
          ctx.beginPath();
          ctx.moveTo(p.x, p.y - 29);
          ctx.quadraticCurveTo(
            p.x + flagLength * 0.5,
            p.y - 25 + wave * 2,
            p.x + flagLength,
            p.y - 23 + tipWave,
          );
          ctx.quadraticCurveTo(
            p.x + flagLength * 0.48,
            p.y - 20 - wave * 1.5,
            p.x,
            p.y - 17,
          );
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = "rgba(255,255,255,0.42)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(p.x + 2, p.y - 23);
          ctx.quadraticCurveTo(p.x + flagLength * 0.5, p.y - 21 + wave, p.x + flagLength - 2, p.y - 22 + tipWave);
          ctx.stroke();
        });
      }

      function drawShortcutGates() {
        for (const shortcut of shortcutTracks) {
          const gateIndex = Math.min(shortcut.gateIndex || 10, shortcut.samples.length - 1);
          const gate = shortcut.samples[gateIndex];
          const state = shortcutGateState(shortcut);
          const open = state.phase === "open";
          const halfWidth = shortcut.width / 2;
          const pulse = 0.72 + Math.sin(raceTime * 7) * 0.18;
          ctx.save();
          ctx.translate(gate.x, gate.y);
          ctx.rotate(gate.angle);

          for (const side of [-1, 1]) {
            ctx.fillStyle = "#6b5030";
            roundRect(-6, side * (halfWidth + 1) - 6, 12, 12, 3);
            ctx.fill();
            ctx.strokeStyle = "#f1b747";
            ctx.lineWidth = 2;
            ctx.stroke();
            const light = open ? "83, 221, 104" : state.phase === "closing" || state.phase === "opening"
              ? "247, 177, 50" : "239, 65, 48";
            ctx.fillStyle = `rgba(${light}, ${pulse})`;
            ctx.beginPath();
            ctx.arc(0, side * (halfWidth + 1), 2.8, 0, TAU);
            ctx.fill();
          }

          ctx.lineCap = "butt";
          const armLength = (halfWidth - 5) * (1 - state.openness);
          for (const side of [-1, 1]) {
            const startY = side * (halfWidth - 5);
            const endY = startY - side * armLength;
            ctx.strokeStyle = "#f6ead0";
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(0, startY);
            ctx.lineTo(0, endY);
            ctx.stroke();
            ctx.strokeStyle = "#e64f3d";
            ctx.lineWidth = 6;
            ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.moveTo(0, startY);
            ctx.lineTo(0, endY);
            ctx.stroke();
            ctx.setLineDash([]);
          }
          ctx.restore();
        }
      }

      function traceOpenSamples(samples) {
        if (samples.length < 2) return false;
        ctx.beginPath();
        ctx.moveTo(samples[0].x, samples[0].y);
        for (let index = 1; index < samples.length; index += 1) {
          ctx.lineTo(samples[index].x, samples[index].y);
        }
        return true;
      }

      function drawShortcutOverpasses() {
        const [edgeColor, shoulderColor, roadColor, highlightColor] = MAPS[currentMapIndex].trackColors;
        ctx.save();
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        for (const shortcut of shortcutTracks) {
          for (const run of shortcut.overlapRuns || []) {
            if (!traceOpenSamples(run)) continue;
            ctx.globalAlpha = 0.16;
            ctx.strokeStyle = edgeColor;
            ctx.lineWidth = shortcut.width + 16;
            ctx.stroke();

            traceOpenSamples(run);
            ctx.globalAlpha = 0.14;
            ctx.strokeStyle = shoulderColor;
            ctx.lineWidth = shortcut.width + 8;
            ctx.stroke();

            traceOpenSamples(run);
            ctx.globalAlpha = 0.3;
            ctx.strokeStyle = roadColor;
            ctx.lineWidth = shortcut.width;
            ctx.stroke();

          }
        }
        ctx.restore();
      }

      function drawFlame(x, y, scale, phase = 0, dimmed = false) {
        const flicker = 1 + Math.sin(phase) * 0.1;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale * flicker);
        ctx.globalAlpha *= dimmed ? 0.24 : 1;
        ctx.fillStyle = dimmed ? "#7d6652" : "#f04b22";
        ctx.beginPath();
        ctx.moveTo(0, -12);
        ctx.bezierCurveTo(8, -5, 8, 4, 0, 10);
        ctx.bezierCurveTo(-8, 5, -7, -3, -2, -8);
        ctx.bezierCurveTo(-1, -4, 2, -3, 0, -12);
        ctx.fill();
        if (!dimmed) {
          ctx.fillStyle = "#ffd84d";
          ctx.beginPath();
          ctx.moveTo(0, -5);
          ctx.bezierCurveTo(4, 0, 3, 6, 0, 8);
          ctx.bezierCurveTo(-4, 4, -3, 0, 0, -5);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawFireRingObstacles() {
        const rings = MAPS[currentMapIndex].obstacles.filter((obstacle) =>
          obstacle.type === "fireRing");
        for (const ring of rings) {
          const position = pathAt(ring.progress, ring.lane || 0);
          const halfWidth = fittedObstacleHalfWidth(ring);
          ctx.save();
          ctx.translate(position.x, position.y);
          ctx.rotate(position.angle);
          const pulse = 0.5 + Math.sin(raceTime * 9) * 0.5;
          ctx.shadowColor = "rgba(255, 63, 12, 0.95)";
          ctx.shadowBlur = 15 + pulse * 7;
          ctx.strokeStyle = `rgba(255, ${95 + pulse * 70}, 24, 0.95)`;
          ctx.lineWidth = 4 + pulse * 1.5;
          ctx.beginPath();
          ctx.ellipse(0, 0, ring.halfLength, halfWidth, 0, 0, TAU);
          ctx.stroke();

          ctx.setLineDash([5, 4]);
          ctx.lineDashOffset = -raceTime * 24;
          ctx.strokeStyle = "rgba(255, 224, 92, 0.95)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(0, 0, ring.halfLength - 2, Math.max(5, halfWidth - 2), 0, 0, TAU);
          ctx.stroke();
          ctx.setLineDash([]);

          for (let index = 0; index < 20; index += 1) {
            const angle = index / 20 * TAU;
            const x = Math.cos(angle) * ring.halfLength;
            const y = Math.sin(angle) * halfWidth;
            const outwardAngle = Math.atan2(
              Math.sin(angle) / Math.max(1, halfWidth),
              Math.cos(angle) / Math.max(1, ring.halfLength),
            );
            const flicker = Math.sin(raceTime * (14 + index % 4) + index * 1.7);
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(outwardAngle + Math.PI / 2);
            drawFlame(0, -2, 0.52 + flicker * 0.1, raceTime * 18 + index * 0.9);
            ctx.restore();

            if (index % 4 === 0) {
              const travel = 6 + ((raceTime * 22 + index * 3) % 10);
              ctx.fillStyle = index % 8 ? "#ff7a24" : "#ffe66d";
              ctx.beginPath();
              ctx.arc(
                x + Math.cos(outwardAngle) * travel,
                y + Math.sin(outwardAngle) * travel,
                1.2 + pulse,
                0,
                TAU,
              );
              ctx.fill();
            }
          }
          ctx.restore();
        }
      }

      function drawFirePickups() {
        for (const pickup of firePickups) {
          const position = pathAt(pickup.progress, pickup.lane);
          const fade = Math.min(1, pickup.life / 0.8);
          const pulse = raceTime * 8 + pickup.phase;
          ctx.save();
          ctx.globalAlpha = fade;
          ctx.translate(position.x, position.y + Math.sin(pulse * 0.45) * 3);
          ctx.shadowColor = "rgba(255, 91, 24, 0.9)";
          ctx.shadowBlur = 9 + Math.sin(pulse) * 3;
          ctx.strokeStyle = "rgba(255, 225, 91, 0.8)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 1, 12, 0, TAU);
          ctx.stroke();
          drawFlame(0, 0, 0.82, pulse);
          ctx.restore();
        }
      }

      function drawParticles() {
        for (const particle of particles) {
          const alpha = Math.max(0, particle.life / particle.maxLife);
          if (particle.type === "trail") {
            ctx.globalAlpha = alpha * (particle.shape === "flake" ? 0.9 : 0.78);
            ctx.fillStyle = particle.shade;
            if (particle.shape === "shard") {
              ctx.strokeStyle = particle.shade;
              ctx.lineWidth = particle.size;
              ctx.beginPath();
              ctx.moveTo(particle.x, particle.y);
              ctx.lineTo(particle.x - particle.vx * 0.02, particle.y - particle.vy * 0.02);
              ctx.stroke();
            } else {
              const height = particle.shape === "grain" ? particle.size * 0.65 : particle.size;
              ctx.fillRect(
                Math.round(particle.x - particle.size / 2),
                Math.round(particle.y - height / 2),
                particle.size,
                height,
              );
            }
            ctx.globalAlpha = 1;
            continue;
          }
          ctx.strokeStyle = `rgba(${particle.color}, ${alpha * 0.9})`;
          ctx.lineWidth = particle.size;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(particle.x, particle.y);
          ctx.lineTo(particle.x - particle.vx * 0.025, particle.y - particle.vy * 0.025);
          ctx.stroke();
        }
      }

      function drawCar(car) {
        const position = getCarPosition(car);
        const jumpScale = 1 + Math.min(0.18, car.height / 210);
        const shadowScale = Math.max(0.68, 1 - car.height / 180);
        ctx.save();
        ctx.translate(position.x, position.y);

        ctx.save();
        ctx.translate(car.height * 0.16, car.height * 0.22 + 3);
        ctx.rotate(car.visualAngle);
        ctx.scale(shadowScale, shadowScale * 0.82);
        ctx.fillStyle = `rgba(0,0,0,${Math.max(0.1, 0.3 - car.height / 190)})`;
        roundRect(-15, -9, 31, 19, 5);
        ctx.fill();
        ctx.restore();

        ctx.translate(0, -car.height * 0.34);
        ctx.rotate(car.visualAngle);
        ctx.scale(jumpScale, jumpScale);

        const fireBoost = Boolean(car.fireNitroActive);
        const burning = car.burnTimer > 0;
        if (car.nitroActive || fireBoost) {
          const flameLength = (fireBoost ? 18 : 9) + Math.sin(raceTime * 38 + car.wobble) * 3;
          for (const offset of [-5, 5]) {
            ctx.fillStyle = fireBoost ? "#f03d19" : "#f6a12b";
            ctx.beginPath();
            ctx.moveTo(-14, offset - 3);
            ctx.lineTo(-14 - flameLength, offset);
            ctx.lineTo(-14, offset + 3);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = fireBoost ? "#ffd84d" : "#75ecff";
            ctx.beginPath();
            ctx.moveTo(-14, offset - 1.5);
            ctx.lineTo(-19 - flameLength * 0.45, offset);
            ctx.lineTo(-14, offset + 1.5);
            ctx.closePath();
            ctx.fill();
          }
        }

        ctx.fillStyle = "#191b1c";
        ctx.fillRect(-11, -13, 8, 5);
        ctx.fillRect(5, -13, 8, 5);
        ctx.fillRect(-11, 8, 8, 5);
        ctx.fillRect(5, 8, 8, 5);

        const bodyGradient = ctx.createLinearGradient(0, -10, 0, 10);
        bodyGradient.addColorStop(0, lighten(car.color, 28));
        bodyGradient.addColorStop(1, car.color);
        ctx.fillStyle = bodyGradient;
        roundRect(-16, -10, 32, 20, 6);
        ctx.fill();
        ctx.strokeStyle = "rgba(0,0,0,0.55)";
        ctx.lineWidth = 2;
        ctx.stroke();

        if (burning && !fireBoost) {
          const burnPulse = 0.5 + Math.sin(raceTime * 20 + car.wobble) * 0.5;
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.strokeStyle = `rgba(255, ${55 + burnPulse * 75}, 16, 0.75)`;
          ctx.lineWidth = 3 + burnPulse * 2;
          ctx.shadowColor = "rgba(255, 55, 8, 0.95)";
          ctx.shadowBlur = 14 + burnPulse * 8;
          roundRect(-19, -13, 38, 26, 8);
          ctx.stroke();
          ctx.restore();

          ctx.shadowColor = "rgba(255, 71, 18, 0.95)";
          ctx.shadowBlur = 13;
          const carFlames = [
            [-12, -10, -0.35, 0.72], [-3, -13, -0.12, 0.82], [8, -11, 0.3, 0.68],
            [14, -3, 0.65, 0.58], [11, 9, 1.05, 0.7], [0, 12, 1.35, 0.62],
            [-12, 8, -1.0, 0.66],
          ];
          for (let index = 0; index < carFlames.length; index += 1) {
            const [x, y, rotation, scale] = carFlames[index];
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            drawFlame(0, 0, scale + burnPulse * 0.09,
              raceTime * (17 + index % 3) + car.wobble + index * 1.3);
            ctx.restore();
          }
          ctx.shadowBlur = 0;
        }

        if (fireBoost) {
          drawFlame(-2, -12, 0.48, raceTime * 15 + car.wobble);
          drawFlame(5, 12, 0.4, raceTime * 17 + car.wobble + 1.8);
        }

        ctx.fillStyle = "#bce5ee";
        roundRect(-4, -7, 10, 14, 3);
        ctx.fill();
        ctx.fillStyle = "rgba(23,49,60,0.55)";
        ctx.fillRect(-1, -6, 2, 12);

        ctx.fillStyle = "#fff7bd";
        ctx.fillRect(12, -7, 3, 4);
        ctx.fillRect(12, 3, 3, 4);

        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.font = "bold 8px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(car.rank), -10, 0);
        ctx.restore();
      }

      function roundRect(x, y, width, height, radius) {
        ctx.beginPath();
        ctx.roundRect(x, y, width, height, radius);
      }

      function lighten(hex, amount) {
        const value = Number.parseInt(hex.slice(1), 16);
        const r = Math.min(255, (value >> 16) + amount);
        const g = Math.min(255, ((value >> 8) & 255) + amount);
        const b = Math.min(255, (value & 255) + amount);
        return `rgb(${r}, ${g}, ${b})`;
      }

      function drawHud() {
        if (!winner) {
          const panelX = 14;
          const panelY = 10;
          const panelWidth = viewWidth - 28;
          const panelHeight = 58;
          const player = cars.find((car) => car.isPlayer);

          ctx.fillStyle = "rgba(9,16,10,0.84)";
          roundRect(panelX, panelY, panelWidth, panelHeight, 8);
          ctx.fill();
          ctx.strokeStyle = "rgba(255,226,99,0.65)";
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.fillStyle = "#ffe263";
          ctx.font = "800 8px Trebuchet MS";
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          ctx.fillText("RACE TIME", panelX + 10, panelY + 14);
          ctx.fillStyle = "#ffffff";
          ctx.font = "900 19px Arial Black, sans-serif";
          ctx.fillText(formatTime(raceTime), panelX + 10, panelY + 38);

          if (player) {
            const positionX = panelX + 116;
            ctx.fillStyle = "#ffe263";
            ctx.font = "800 8px Trebuchet MS";
            ctx.textAlign = "center";
            ctx.fillText("POSITION", positionX, panelY + 14);
            ctx.fillStyle = "#ffffff";
            ctx.font = "900 21px Arial Black, sans-serif";
            ctx.fillText(`${player.rank}/${cars.length}`, positionX, panelY + 39);

            const displayedLap = Math.min(player.lap, TOTAL_LAPS);
            const isFinalLap = displayedLap === TOTAL_LAPS;
            const finalLapPulse = isFinalLap ? 0.5 + Math.sin(raceTime * 7.5) * 0.5 : 0;
            const badgeWidth = 118;
            const badgeX = panelX + (panelWidth - badgeWidth) / 2;
            ctx.save();
            if (isFinalLap) {
              ctx.fillStyle = `rgba(235, ${48 + Math.round(finalLapPulse * 42)}, 24, ${0.86 + finalLapPulse * 0.14})`;
              ctx.shadowColor = `rgba(255, 91, 38, ${0.45 + finalLapPulse * 0.5})`;
              ctx.shadowBlur = 7 + finalLapPulse * 10;
            } else {
              ctx.fillStyle = "rgba(151,43,28,0.92)";
            }
            roundRect(badgeX, panelY + 13, badgeWidth, 32, 6);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = isFinalLap
              ? `rgba(255, 246, 178, ${0.72 + finalLapPulse * 0.28})`
              : "rgba(255,226,99,0.9)";
            ctx.lineWidth = isFinalLap ? 2 + finalLapPulse : 1.5;
            ctx.stroke();
            ctx.fillStyle = "#fff7d0";
            ctx.font = "900 15px Arial Black, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(
              isFinalLap ? "FINAL LAP" : `LAP ${displayedLap} / ${TOTAL_LAPS}`,
              panelX + panelWidth / 2,
              panelY + 29,
            );
            ctx.restore();
            ctx.textAlign = "left";
          }

          drawScoreLogo(panelX + panelWidth - 148, panelY + 9);

          if (player) drawNitroMeter(player);
        } else {
          drawWinnerOverlay();
        }

        drawStartCountdown();
        if (paused) drawPauseOverlay();
      }

      function drawScoreLogo(x, y) {
        const width = 142;
        const height = 40;
        scoreLogoRect = { x, y, width, height };

        for (let row = 0; row < 2; row += 1) {
          for (let column = 0; column < 2; column += 1) {
            ctx.fillStyle = (row + column) % 2 === 0 ? "#fff7d0" : "#28251d";
            ctx.fillRect(x + 2 + column * 6, y + 14 + row * 6, 6, 6);
          }
        }

        ctx.fillStyle = "#fff7d0";
        ctx.font = "21px Impact, Arial Black, sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.shadowColor = "rgba(83, 17, 11, 0.95)";
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;
        ctx.shadowBlur = 0;
        ctx.fillText("RETRO RALLY", x + 20, y + height / 2 + 1);
        ctx.shadowColor = "transparent";
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;
      }

      function drawNitroMeter(player) {
        const width = 126;
        const height = 15;
        const x = viewWidth - width - 18;
        const y = 121;
        const fireActive = player.fireNitroActive;
        const available = fireActive || player.nitroActive || player.nitro >= NITRO_MINIMUM;
        nitroButton.classList.toggle("locked", !available);
        ctx.fillStyle = fireActive ? "rgba(76, 17, 8, 0.92)" : "rgba(7, 16, 18, 0.82)";
        roundRect(x - 7, y - 25, width + 14, 62, 7);
        ctx.fill();
        if (fireActive) {
          ctx.strokeStyle = `rgba(255, 184, 54, ${0.7 + Math.sin(raceTime * 12) * 0.2})`;
          ctx.lineWidth = 2;
          ctx.stroke();
        }
        ctx.fillStyle = fireActive ? "#ffd84d" : available ? "#bdeeff" : "#ff9b7f";
        ctx.font = "900 11px Trebuchet MS";
        ctx.textAlign = "left";
        ctx.fillText(fireActive ? "FIRE NITRO!" : "NITRO", x, y - 10);
        ctx.textAlign = "right";
        ctx.fillText(
          fireActive ? `${player.fireNitroTimer.toFixed(1)}s` : `${Math.round(player.nitro * 100)}%`,
          x + width,
          y - 10,
        );
        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.fillRect(x, y, width, height);
        const gradient = ctx.createLinearGradient(x, 0, x + width, 0);
        gradient.addColorStop(0, fireActive ? "#d9230f" : available ? "#087cad" : "#8f1712");
        gradient.addColorStop(1, fireActive ? "#ffd84d" : available ? "#75ecff" : "#f06b54");
        ctx.fillStyle = gradient;
        const meterAmount = fireActive ? player.fireNitroTimer / 3.6 : player.nitro;
        ctx.fillRect(x, y, width * meterAmount, height);
        if (!fireActive) {
          ctx.fillStyle = "rgba(255,255,255,0.9)";
          ctx.fillRect(x + width * NITRO_MINIMUM - 1, y - 2, 2, height + 4);
        }
        ctx.strokeStyle = "rgba(255,255,255,0.62)";
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, width, height);

        ctx.textAlign = "left";
        ctx.fillStyle = fireActive ? "#ffd84d" : "rgba(255,255,255,0.7)";
        ctx.font = "800 8px Trebuchet MS";
        ctx.fillText("FLAMES", x, y + 28);
        for (let index = 0; index < 4; index += 1) {
          drawFlame(x + 52 + index * 15, y + 27, 0.34, raceTime * 8 + index, index >= player.fireCollected && !fireActive);
        }
        ctx.textAlign = "right";
        ctx.fillStyle = "#fff7d0";
        ctx.fillText(fireActive ? "4/4" : `${player.fireCollected}/4`, x + width, y + 28);
      }

      function drawWinnerOverlay() {
        const player = cars.find((car) => car.isPlayer);
        const width = Math.min(418, viewWidth - 24);
        const height = 410;
        const x = (viewWidth - width) / 2;
        const y = viewHeight * 0.18;
        const raceFinishTime = player?.finishTime ?? raceTime;
        const playerLapTimes = player?.lapTimes ?? [];
        const bestLap = playerLapTimes.length ? Math.min(...playerLapTimes) : null;
        const finalPosition = player?.rank ?? cars.length;
        const ordinal = ["", "1ST", "2ND", "3RD", "4TH"][finalPosition] || `${finalPosition}TH`;
        const finishOrder = [...cars]
          .sort((a, b) => {
            if (a.finished && b.finished) return a.finishTime - b.finishTime;
            if (a.finished) return -1;
            if (b.finished) return 1;
            return b.progress - a.progress;
          })
          .slice(0, 3);

        ctx.fillStyle = "rgba(15,20,15,0.95)";
        roundRect(x, y, width, height, 12);
        ctx.fill();
        ctx.strokeStyle = player?.color || "#ffe263";
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = "#ffe263";
        ctx.font = "900 15px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("RACE COMPLETE", viewWidth / 2, y + 22);
        ctx.fillStyle = "#ffffff";
        ctx.font = "900 24px Trebuchet MS";
        ctx.fillText(`PLAYER FINISHED ${ordinal}`, viewWidth / 2, y + 50);

        const podiumBaseY = y + 143;
        const podiumWidth = 82;
        const podiumGap = 5;
        const podiumHeights = [46, 64, 38];
        const podiumPlaces = [2, 1, 3];
        const podiumStartX = viewWidth / 2 - (podiumWidth * 3 + podiumGap * 2) / 2;
        for (let slot = 0; slot < 3; slot += 1) {
          const place = podiumPlaces[slot];
          const car = finishOrder[place - 1];
          const blockX = podiumStartX + slot * (podiumWidth + podiumGap);
          const blockY = podiumBaseY - podiumHeights[slot];
          const isPlayer = Boolean(car?.isPlayer);
          ctx.fillStyle = isPlayer ? "#c7442f" : "rgba(255,255,255,0.12)";
          roundRect(blockX, blockY, podiumWidth, podiumHeights[slot], 5);
          ctx.fill();
          ctx.strokeStyle = isPlayer ? "#ffe263" : (car?.color || "rgba(255,255,255,0.35)");
          ctx.lineWidth = isPlayer ? 2.5 : 1.5;
          ctx.stroke();
          ctx.fillStyle = place === 1 ? "#ffe263" : "#ffffff";
          ctx.font = "900 18px Arial Black, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(String(place), blockX + podiumWidth / 2, blockY + 12);
          ctx.fillStyle = isPlayer ? "#fff7d0" : "rgba(255,255,255,0.8)";
          ctx.font = "800 9px Trebuchet MS";
          ctx.fillText(car?.name || "--", blockX + podiumWidth / 2, blockY + podiumHeights[slot] - 8);
        }

        ctx.fillStyle = "rgba(255,226,99,0.14)";
        roundRect(x + 14, y + 154, width - 28, 42, 6);
        ctx.fill();
        ctx.fillStyle = "#ffe263";
        ctx.font = "800 10px Trebuchet MS";
        ctx.textAlign = "left";
        ctx.fillText("RACE TIME", x + 26, y + 167);
        ctx.fillStyle = "#ffffff";
        ctx.font = "900 18px Trebuchet MS";
        ctx.fillText(formatTime(raceFinishTime), x + 26, y + 184);
        ctx.fillStyle = finalPosition === 1 ? "#79e69a" : "#ffe263";
        ctx.font = "900 13px Trebuchet MS";
        ctx.textAlign = "right";
        ctx.fillText(`YOUR POSITION ${finalPosition}/${cars.length}`, x + width - 26, y + 176);

        ctx.fillStyle = "#ffffff";
        ctx.font = "900 12px Trebuchet MS";
        ctx.textAlign = "left";
        ctx.fillText("PLAYER LAP TIMES", x + 18, y + 215);
        if (bestLap !== null) {
          ctx.fillStyle = "#79e69a";
          ctx.font = "800 10px Trebuchet MS";
          ctx.textAlign = "right";
          ctx.fillText(`BEST ${formatTime(bestLap)}`, x + width - 18, y + 215);
        }

        const tableTop = y + 229;
        const columnGap = 10;
        const columnWidth = (width - 46 - columnGap) / 2;
        for (let column = 0; column < 2; column += 1) {
          const columnX = x + 18 + column * (columnWidth + columnGap);
          ctx.fillStyle = "rgba(255,255,255,0.08)";
          roundRect(columnX, tableTop, columnWidth, 128, 5);
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,0.54)";
          ctx.font = "800 9px Trebuchet MS";
          ctx.textAlign = "left";
          ctx.fillText("LAP", columnX + 10, tableTop + 13);
          ctx.textAlign = "right";
          ctx.fillText("TIME", columnX + columnWidth - 10, tableTop + 13);

          for (let row = 0; row < 5; row += 1) {
            const lapIndex = column * 5 + row;
            const lapTime = playerLapTimes[lapIndex];
            const rowY = tableTop + 32 + row * 18;
            if (row > 0) {
              ctx.fillStyle = "rgba(255,255,255,0.06)";
              ctx.fillRect(columnX + 8, rowY - 10, columnWidth - 16, 1);
            }
            const isBest = lapTime !== undefined && lapTime === bestLap;
            ctx.fillStyle = isBest ? "#79e69a" : "rgba(255,255,255,0.78)";
            ctx.font = isBest ? "900 11px Trebuchet MS" : "700 11px Trebuchet MS";
            ctx.textAlign = "left";
            ctx.fillText(String(lapIndex + 1), columnX + 10, rowY);
            ctx.textAlign = "right";
            ctx.fillText(lapTime === undefined ? "--" : formatTime(lapTime), columnX + columnWidth - 10, rowY);
          }
        }

        ctx.fillStyle = "rgba(255,255,255,0.58)";
        ctx.font = "700 10px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText(
          "R restart  •  Click the logo to choose a track",
          viewWidth / 2,
          y + height - 19,
        );
      }

      function drawStartCountdown() {
        if (waitingForStart) {
          drawStartNotice();
          return;
        }
        if (startCountdown <= 0 && goFlash <= 0) return;
        const isGo = startCountdown <= 0;
        const label = isGo ? "GO!" : String(Math.ceil(startCountdown));
        const stepProgress = isGo
          ? 1 - goFlash / 0.8
          : Math.ceil(startCountdown) - startCountdown;
        const pulse = 1 + Math.max(0, 1 - stepProgress) ** 3 * (isGo ? 0.38 : 0.25);
        const x = viewWidth / 2;
        const y = viewHeight * 0.42;

        ctx.save();
        ctx.translate(x, y);
        ctx.scale(pulse, pulse);
        ctx.globalAlpha = isGo ? Math.min(1, goFlash * 2.5) : 1;
        ctx.shadowColor = "rgba(0,0,0,0.65)";
        ctx.shadowBlur = 18;
        ctx.fillStyle = isGo ? "#39b95f" : "#d7472f";
        roundRect(isGo ? -72 : -48, -48, isGo ? 144 : 96, 96, isGo ? 24 : 48);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#ffe263";
        ctx.lineWidth = 6;
        ctx.stroke();
        ctx.strokeStyle = "rgba(255,255,255,0.75)";
        ctx.lineWidth = 2;
        roundRect(isGo ? -64 : -40, -40, isGo ? 128 : 80, 80, isGo ? 18 : 40);
        ctx.stroke();
        ctx.fillStyle = "#fff7d0";
        ctx.font = `900 ${isGo ? 48 : 62}px Impact, Arial Black, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(label, 0, 3);
        ctx.restore();
      }

      function drawThumbnailTrack(map, x, y, width, height) {
        if (map.bakedTrack) return;
        const points = map.controlPoints.map(([px, py]) => ({
          x: x + ((32 + px * (GAME_WIDTH - 64)) / GAME_WIDTH) * width,
          y: y + ((140 + (py - 0.12) / 0.76 * 815) / GAME_HEIGHT) * height,
        }));
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let index = 1; index < points.length; index += 1) ctx.lineTo(points[index].x, points[index].y);
        ctx.closePath();
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.strokeStyle = map.trackColors[0];
        ctx.lineWidth = 20;
        ctx.stroke();
        ctx.strokeStyle = map.trackColors[2];
        ctx.lineWidth = 15;
        ctx.stroke();
      }

      function drawStartNotice() {
        const x = viewWidth / 2;
        const y = viewHeight * 0.34;
        const showKeyboardControls = window.matchMedia("(pointer: fine)").matches;
        const panelWidth = 414;
        const panelHeight = 450;
        const cardWidth = 170;
        const cardHeight = 185;
        const cardGap = 12;
        const cardsX = -(cardWidth * 2 + cardGap) / 2;
        const cardsY = -105;
        mapCardRects = [];
        mapStartButtonRect = null;

        ctx.save();
        ctx.translate(x, y);
        ctx.shadowColor = "rgba(0,0,0,0.72)";
        ctx.shadowBlur = 22;
        ctx.fillStyle = "rgba(10,18,14,0.96)";
        roundRect(-panelWidth / 2, -panelHeight / 2, panelWidth, panelHeight, 16);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#ffe263";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = "rgba(89,22,15,0.86)";
        roundRect(-132, -205, 264, 57, 9);
        ctx.fill();
        ctx.strokeStyle = "#ffe263";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = "#fff7d0";
        ctx.font = "38px Impact, Arial Black, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("RETRO RALLY", 0, -175);

        ctx.fillStyle = "#e94b35";
        ctx.font = "900 12px Trebuchet MS";
        ctx.fillText("CHOOSE YOUR TRACK", 0, -130);

        SELECTABLE_MAP_INDEXES.forEach((mapIndex, visibleIndex) => {
          const map = MAPS[mapIndex];
          const column = visibleIndex % 2;
          const row = Math.floor(visibleIndex / 2);
          const cardX = cardsX + column * (cardWidth + cardGap);
          const cardY = cardsY + row * (cardHeight + cardGap);
          const selected = mapIndex === currentMapIndex;
          ctx.fillStyle = selected ? "rgba(255,226,99,0.18)" : "rgba(255,255,255,0.07)";
          roundRect(cardX, cardY, cardWidth, cardHeight, 7);
          ctx.fill();
          ctx.strokeStyle = selected ? "#ffe263" : "rgba(255,255,255,0.3)";
          ctx.lineWidth = selected ? 3 : 1.5;
          ctx.stroke();

          const imageX = cardX + 4;
          const imageY = cardY + 4;
          const imageWidth = cardWidth - 8;
          const imageHeight = 143;
          ctx.save();
          roundRect(imageX, imageY, imageWidth, imageHeight, 4);
          ctx.clip();
          const image = mapImages[mapIndex];
          if (image.complete && image.naturalWidth > 0) {
            ctx.drawImage(image, imageX, imageY, imageWidth, imageHeight);
          } else {
            ctx.fillStyle = "#263a2d";
            ctx.fillRect(imageX, imageY, imageWidth, imageHeight);
          }
          drawThumbnailTrack(map, imageX, imageY, imageWidth, imageHeight);
          ctx.restore();

          ctx.fillStyle = selected ? "#ffe263" : "#ffffff";
          ctx.font = "900 11px Arial Black, sans-serif";
          ctx.fillText(map.name, cardX + cardWidth / 2, cardY + 160);
          ctx.fillStyle = selected ? "#fff3a2" : "rgba(255,255,255,0.62)";
          ctx.font = "800 7px Trebuchet MS";
          ctx.fillText(map.tag, cardX + cardWidth / 2, cardY + 176);
          mapCardRects.push({
            index: mapIndex,
            x: x + cardX,
            y: y + cardY,
            width: cardWidth,
            height: cardHeight,
          });
        });

        const startButtonX = -94;
        const startButtonY = 105;
        const startButtonWidth = 188;
        const startButtonHeight = 44;
        ctx.fillStyle = "#d7472f";
        roundRect(startButtonX, startButtonY, startButtonWidth, startButtonHeight, 8);
        ctx.fill();
        ctx.strokeStyle = "#ffe263";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = "#fff7d0";
        ctx.font = "900 17px Arial Black, sans-serif";
        ctx.fillText("START RACE", 0, startButtonY + startButtonHeight / 2 + 1);
        mapStartButtonRect = {
          x: x + startButtonX,
          y: y + startButtonY,
          width: startButtonWidth,
          height: startButtonHeight,
        };

        if (showKeyboardControls) {
          ctx.fillStyle = "#ffe263";
          ctx.font = "800 9px Trebuchet MS";
          ctx.fillText("ARROWS DRIVE   SPACE NITRO   R RESTART   P PAUSE", 0, 168);
        }
        ctx.restore();
      }

      function drawPauseOverlay() {
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.fillRect(0, 0, viewWidth, viewHeight);
        ctx.fillStyle = "#ffffff";
        ctx.font = "900 36px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText("PAUSED", viewWidth / 2, viewHeight / 2);
      }

      function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const remainder = seconds - minutes * 60;
        return `${minutes}:${remainder.toFixed(1).padStart(4, "0")}`;
      }

      function draw() {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        ctx.shadowColor = "transparent";
        ctx.filter = "none";
        ctx.clearRect(0, 0, viewWidth, viewHeight);
        drawMapBase();
        drawJunglePonds();
        drawStartLine();
        drawTrackObjects();
        drawFireRingObstacles();
        drawScenery();
        drawFirePickups();
        drawParticles();

        const drawOrder = [...cars].sort((a, b) => {
          if (a.airborne !== b.airborne) return a.airborne ? 1 : -1;
          const pa = getCarPosition(a);
          const pb = getCarPosition(b);
          return pa.y - pb.y;
        });
        drawOrder.filter((car) => !car.shortcutId).forEach(drawCar);
        drawShortcutOverpasses();
        drawOrder.filter((car) => car.shortcutId).forEach(drawCar);
        drawShortcutGates();
        drawHud();
      }

      function frame(now) {
        const dt = Math.min(0.035, (now - lastTime) / 1000);
        lastTime = now;
        syncKeyboardInput();
        if (!paused) updateRace(dt);
        updateAudio();
        draw();
        requestAnimationFrame(frame);
      }

      function syncKeyboardInput() {
        const keyboardSteer = (keys.has("ArrowRight") ? 1 : 0) - (keys.has("ArrowLeft") ? 1 : 0);
        const accelerating = keys.has("ArrowUp") || touchControls.gas;
        const braking = keys.has("ArrowDown") || touchControls.brake;
        input.steer = keyboardSteer || touchSteer;
        input.throttle = (accelerating ? 1 : 0) - (braking ? 1 : 0);
        if (nitroPointer === null) input.nitro = keys.has("Space") || keys.has("KeyN");
        updateSteeringVisual(input.steer);
        gasPedal.classList.toggle("active", accelerating);
        brakePedal.classList.toggle("active", braking);
        nitroButton.classList.toggle("active", input.nitro);
      }

      function updateSteeringVisual(value) {
        const steer = Math.max(-1, Math.min(1, value));
        steeringSlider.style.setProperty("--wheel-x", `${(steer * 45).toFixed(1)}px`);
        steeringSlider.style.setProperty("--wheel-turn", `${(steer * 115).toFixed(1)}deg`);
        steeringSlider.setAttribute("aria-valuenow", String(Math.round(steer * 100)));
      }

      function updateTouchSteering(event) {
        const bounds = steeringSlider.getBoundingClientRect();
        const center = bounds.left + bounds.width / 2;
        const travel = bounds.width * 0.35;
        const rawSteer = (event.clientX - center) / travel;
        touchSteer = Math.max(-1, Math.min(1, rawSteer));
        if (Math.abs(touchSteer) < 0.035) touchSteer = 0;
        updateSteeringVisual(touchSteer);
      }

      steeringSlider.addEventListener("pointerdown", (event) => {
        if (steeringPointer !== null) return;
        ensureAudio();
        steeringPointer = event.pointerId;
        steeringSlider.setPointerCapture(event.pointerId);
        steeringSlider.classList.add("dragging");
        updateTouchSteering(event);
        event.preventDefault();
      });
      steeringSlider.addEventListener("pointermove", (event) => {
        if (event.pointerId !== steeringPointer) return;
        updateTouchSteering(event);
        event.preventDefault();
      });
      const releaseSteering = (event) => {
        if (event.pointerId !== steeringPointer) return;
        steeringPointer = null;
        touchSteer = 0;
        steeringSlider.classList.remove("dragging");
        updateSteeringVisual(0);
      };
      steeringSlider.addEventListener("pointerup", releaseSteering);
      steeringSlider.addEventListener("pointercancel", releaseSteering);

      function bindHoldControl(button, controlName) {
        const pointers = new Set();
        button.addEventListener("pointerdown", (event) => {
          ensureAudio();
          pointers.add(event.pointerId);
          touchControls[controlName] = true;
          button.setPointerCapture(event.pointerId);
          event.preventDefault();
        });
        const release = (event) => {
          pointers.delete(event.pointerId);
          touchControls[controlName] = pointers.size > 0;
        };
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
      }

      bindHoldControl(gasPedal, "gas");
      bindHoldControl(brakePedal, "brake");

      nitroButton.addEventListener("pointerdown", (event) => {
        ensureAudio();
        nitroPointer = event.pointerId;
        nitroButton.setPointerCapture(event.pointerId);
        input.nitro = true;
        event.preventDefault();
      });
      const releaseNitro = (event) => {
        if (event.pointerId !== nitroPointer) return;
        nitroPointer = null;
        input.nitro = false;
      };
      nitroButton.addEventListener("pointerup", releaseNitro);
      nitroButton.addEventListener("pointercancel", releaseNitro);
      soundButton.addEventListener("click", toggleSound);
      stage.addEventListener("pointerdown", (event) => {
        if (event.target !== soundButton) {
          ensureAudio();
          if (returnToStartAtPointer(event)) return;
          if (selectMapAtPointer(event)) return;
          startRaceAtPointer(event);
        }
      }, { capture: true });

      window.addEventListener("resize", resize);
      window.addEventListener("keydown", (event) => {
        if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(event.code)) {
          event.preventDefault();
        }
        ensureAudio();
        if (event.code === "KeyR") {
          resetRace();
          return;
        }
        const wasWaiting = waitingForStart;
        beginStartSequence();
        keys.add(event.code);
        if (event.code === "KeyP" && !event.repeat && !wasWaiting) paused = !paused;
      });
      window.addEventListener("keyup", (event) => { keys.delete(event.code); });
      window.addEventListener("blur", () => {
        keys.clear();
        Object.keys(touchControls).forEach((control) => { touchControls[control] = false; });
        steeringPointer = null;
        touchSteer = 0;
        steeringSlider.classList.remove("dragging");
        updateSteeringVisual(0);
        input.steer = 0;
        input.throttle = 0;
        input.nitro = false;
      });

      resize();
      resetRace();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
