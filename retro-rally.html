<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Retro Rally</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Trebuchet MS", Verdana, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: #172617;
    }

    body {
      position: relative;
      background:
        radial-gradient(circle at center, #29452a 0, #172617 68%),
        #172617;
    }

    .game-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 450px;
      height: 1000px;
      overflow: hidden;
      transform-origin: center;
    }

    canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    .title {
      position: absolute;
      top: 18px;
      left: 50%;
      z-index: 2;
      transform: translateX(-50%);
      padding: 8px 18px 7px;
      border: 3px solid #ffe263;
      border-radius: 7px;
      background: #d7472f;
      box-shadow: 0 5px 0 #862919, 0 12px 24px rgba(0, 0, 0, 0.35);
      color: #fff7d0;
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 30px;
      letter-spacing: 0.08em;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 2px 2px 0 #762113;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .game-stage.racing .title {
      opacity: 0;
      transform: translate(-50%, -12px) scale(0.9);
    }

    .hint {
      position: absolute;
      right: 14px;
      bottom: 12px;
      z-index: 2;
      padding: 7px 10px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 6px;
      background: rgba(10, 17, 10, 0.62);
      color: rgba(255, 255, 255, 0.72);
      font-size: 11px;
      letter-spacing: 0.06em;
      pointer-events: none;
    }

    .sound-button {
      position: absolute;
      top: 101px;
      left: 14px;
      z-index: 5;
      display: grid;
      width: 42px;
      height: 38px;
      padding: 6px;
      place-items: center;
      border: 2px solid #70d9ee;
      border-radius: 9px;
      background: rgba(7, 27, 34, 0.82);
      color: #c8f7ff;
      box-shadow: 0 3px 0 #143844;
      cursor: pointer;
      touch-action: manipulation;
    }

    .sound-button svg {
      width: 24px;
      height: 24px;
      overflow: visible;
    }

    .sound-button .sound-wave,
    .sound-button .sound-slash {
      transition: opacity 130ms ease, transform 130ms ease;
      transform-origin: center;
    }

    .sound-button .sound-slash {
      opacity: 0;
      transform: scale(0.65);
    }

    .sound-button.muted {
      border-color: #e37062;
      color: #b9c2bf;
    }

    .sound-button.muted .sound-wave {
      opacity: 0;
      transform: scale(0.7);
    }

    .sound-button.muted .sound-slash {
      opacity: 1;
      transform: scale(1);
    }

    .mobile-controls {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .steering-slider,
    .pedals {
      position: absolute;
      left: 18px;
      bottom: 28px;
    }

    .steering-slider {
      --wheel-x: 0px;
      --wheel-turn: 0deg;
      width: 166px;
      height: 102px;
      border: 1px solid rgba(249, 223, 114, 0.68);
      border-radius: 22px;
      background: rgba(20, 35, 29, 0.92);
      box-shadow: 0 5px 0 rgba(12, 23, 18, 0.92), 0 8px 18px rgba(0, 0, 0, 0.52);
      pointer-events: auto;
      touch-action: none;
    }

    .steering-track {
      position: absolute;
      right: 13px;
      bottom: 21px;
      left: 13px;
      height: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 999px;
      background: #17231e;
      box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.7);
    }

    .steering-track::after {
      position: absolute;
      top: -5px;
      left: 50%;
      width: 2px;
      height: 16px;
      background: #ffe263;
      content: "";
      transform: translateX(-50%);
    }

    .steering-wheel {
      position: absolute;
      top: 38px;
      left: 50%;
      width: 64px;
      height: 64px;
      border: 8px solid #e94b35;
      border-radius: 50%;
      background: rgba(20, 28, 24, 0.88);
      box-shadow: inset 0 0 0 2px #7f2118, 0 4px 0 #681b14, 0 6px 9px rgba(0, 0, 0, 0.42);
      transform: translate(calc(-50% + var(--wheel-x)), -50%) rotate(var(--wheel-turn));
      transition: transform 100ms ease-out;
    }

    .steering-slider.dragging .steering-wheel {
      transition: none;
    }

    .steering-wheel::before,
    .steering-wheel::after {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 43px;
      height: 7px;
      border-radius: 4px;
      background: #f9df72;
      content: "";
      transform: translate(-50%, -50%);
    }

    .steering-wheel::after {
      transform: translate(-50%, -50%) rotate(90deg);
    }

    .steering-hub {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 1;
      width: 17px;
      height: 17px;
      border: 3px solid #fff0a5;
      border-radius: 50%;
      background: #9f2b1f;
      transform: translate(-50%, -50%);
    }

    .steering-label {
      position: absolute;
      bottom: 3px;
      color: rgba(255, 255, 255, 0.88);
      font: 800 9px/1 "Arial Black", sans-serif;
    }

    .steering-label.left { left: 11px; }
    .steering-label.right { right: 11px; }

    .pedals {
      right: 98px;
      left: auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .drive-button {
      width: 66px;
      height: 90px;
      border: 2px solid rgba(249, 223, 114, 0.58);
      border-radius: 18px;
      background: linear-gradient(145deg, #e94b35, #a9291d);
      box-shadow: 0 4px 0 #681b14, 0 6px 12px rgba(0, 0, 0, 0.42);
      color: #fff7d0;
      font: 900 27px/1 "Arial Black", sans-serif;
      pointer-events: auto;
      touch-action: none;
    }

    .pedal {
      position: relative;
      overflow: hidden;
      border: 2px solid rgba(174, 184, 178, 0.68);
      border-radius: 10px 10px 16px 16px;
      background:
        linear-gradient(105deg, transparent 42%, rgba(255, 255, 255, 0.18) 48%, transparent 55%),
        linear-gradient(145deg, #78847f, #303b36 68%, #1b2420);
      box-shadow:
        inset 2px 2px 0 rgba(255, 255, 255, 0.2),
        inset -3px -4px 0 rgba(0, 0, 0, 0.28),
        0 6px 0 #141c18,
        0 9px 13px rgba(0, 0, 0, 0.48);
      font-size: 30px;
      letter-spacing: 0.06em;
      text-shadow: 0 2px 1px rgba(0, 0, 0, 0.72);
    }

    .pedal::before {
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(230, 238, 233, 0.32);
      border-radius: 5px 5px 11px 11px;
      background: repeating-linear-gradient(
        0deg,
        rgba(10, 17, 14, 0.72) 0 4px,
        rgba(168, 179, 173, 0.28) 4px 7px,
        transparent 7px 14px
      );
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.65);
      content: "";
    }

    .pedal::after {
      position: absolute;
      right: 12px;
      bottom: 5px;
      left: 12px;
      height: 5px;
      border-radius: 4px;
      background: #101713;
      box-shadow: 0 2px 0 rgba(196, 207, 201, 0.22);
      content: "";
    }

    .pedal span {
      position: relative;
      z-index: 1;
    }

    .gas-pedal {
      width: 76px;
      height: 116px;
      border-color: rgba(155, 198, 164, 0.64);
      color: #e7ffe8;
    }

    .brake-pedal {
      width: 68px;
      height: 102px;
      border-color: rgba(196, 154, 141, 0.64);
      color: #ffe0d6;
    }

    .drive-button.active {
      transform: translateY(5px);
      box-shadow: 0 0 0 #681b14, 0 2px 7px rgba(0, 0, 0, 0.4);
      filter: brightness(1.35);
    }

    .nitro-button {
      position: absolute;
      right: 12px;
      bottom: 42px;
      width: 72px;
      height: 72px;
      border: 2px solid rgba(189, 238, 255, 0.68);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #56dbff, #087cad 62%, #03445f);
      box-shadow: 0 6px 0 #032f43, 0 9px 18px rgba(0, 0, 0, 0.45);
      color: white;
      font: 900 12px/1 "Arial Black", sans-serif;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 0 #03445f;
      pointer-events: auto;
      touch-action: none;
    }

    .nitro-button.active {
      transform: translateY(5px);
      box-shadow: 0 1px 0 #032f43, 0 3px 10px rgba(0, 0, 0, 0.45);
      filter: brightness(1.3);
    }

    .nitro-button.locked {
      border-color: rgba(255, 155, 127, 0.7);
      background: radial-gradient(circle at 35% 28%, #f06b54, #a9291d 62%, #58130f);
      box-shadow: 0 6px 0 #48100d, 0 9px 18px rgba(0, 0, 0, 0.45);
      color: #ffd8ce;
      text-shadow: 0 2px 0 #58130f;
    }

    @media (pointer: fine) {
      .mobile-controls { opacity: 0.96; }
    }

  </style>
</head>
<body>
  <div class="game-stage racing" id="gameStage">
    <canvas id="game" aria-label="Playable off-road racing game"></canvas>
    <div class="title">Retro Rally</div>
    <div class="hint">Arrows drive · Space nitro · R restart · P pause</div>
    <button class="sound-button" id="soundButton" type="button" aria-label="Mute sound" title="Mute sound">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 9v6h4l5 4V5L7 9H3Z" fill="currentColor"/>
        <path class="sound-wave" d="M15 8.5c1.8 1.8 1.8 5.2 0 7M18 6c3.2 3.2 3.2 8.8 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path class="sound-slash" d="M4 4 20 20" fill="none" stroke="#ff6b57" stroke-width="2.8" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="mobile-controls" aria-label="Driving controls">
      <div class="steering-slider" id="steeringSlider" role="slider" aria-label="Steering" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <div class="steering-track"></div>
        <div class="steering-wheel" id="steeringWheel"><span class="steering-hub"></span></div>
        <span class="steering-label left">L</span>
        <span class="steering-label right">R</span>
      </div>
      <div class="pedals" role="group" aria-label="Pedals">
        <button class="drive-button pedal gas-pedal" id="gasPedal" type="button" aria-label="Accelerate"><span>+</span></button>
        <button class="drive-button pedal brake-pedal" id="brakePedal" type="button" aria-label="Decelerate"><span>−</span></button>
      </div>
      <button class="nitro-button" id="nitroButton" type="button" aria-label="Hold for nitro">NITRO</button>
    </div>
  </div>

          ],
          shortcuts: [
            { id: "ice-tunnel", from: 0.23, to: 0.43, width: 45, via: [[0.65, 0.34], [0.67, 0.5]], cycle: 9, openFor: 4.1, phase: 3.4 },
          ],
          trackColors: ["#607889", "#b8cad4", "#dbe6e8", "rgba(255,255,255,0.35)"],
        },
      ];

      const SELECTABLE_MAP_INDEXES = [0, 1];

      let currentMapIndex = 0;
      const mapImages = MAPS.map((map, index) => {
        const image = new Image();
        image.addEventListener("load", () => {
          if (index === currentMapIndex) mapReady = true;
        });
        image.src = map.imageSrc;
        return image;
      });
      let activeMapImage = mapImages[currentMapIndex];

      function seededRandom() {
        scenerySeed = (scenerySeed * 1664525 + 1013904223) >>> 0;
        return scenerySeed / 4294967296;
      }

      function midiToFrequency(note) {
        return 440 * 2 ** ((note - 69) / 12);
      }

      function updateSoundButton() {
        soundButton.classList.toggle("muted", !soundEnabled);
        const label = soundEnabled ? "Mute sound" : "Enable sound";
        soundButton.setAttribute("aria-label", label);
        soundButton.title = label;
      }

      function ensureAudio() {
        if (!audioContext) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          audioContext = new AudioContextClass();

          masterGain = audioContext.createGain();
          masterGain.gain.value = 0.42;
          const compressor = audioContext.createDynamicsCompressor();
          compressor.threshold.value = -15;
          compressor.knee.value = 12;
          compressor.ratio.value = 6;
          masterGain.connect(compressor).connect(audioContext.destination);

          musicGain = audioContext.createGain();
          musicGain.gain.value = 0.34;
          musicGain.connect(masterGain);

          engineGain = audioContext.createGain();
          engineGain.gain.value = 0.03;
          engineFilter = audioContext.createBiquadFilter();
          engineFilter.type = "bandpass";
          engineFilter.frequency.value = 320;
          engineFilter.Q.value = 0.45;
          engineFilter.connect(engineGain).connect(masterGain);

          engineOscillator = audioContext.createOscillator();
          engineOscillator.type = "sawtooth";
          engineOscillator.frequency.value = 48;
          engineOscillator.connect(engineFilter);
          engineOscillator.start();

          engineSubOscillator = audioContext.createOscillator();
          engineSubOscillator.type = "triangle";
          engineSubOscillator.frequency.value = 24;
          const subGain = audioContext.createGain();
          subGain.gain.value = 0.14;
          engineSubOscillator.connect(subGain).connect(engineFilter);
          engineSubOscillator.start();

          noiseBuffer = audioContext.createBuffer(1, audioContext.sampleRate * 2, audioContext.sampleRate);
          const noise = noiseBuffer.getChannelData(0);
          for (let index = 0; index < noise.length; index += 1) noise[index] = Math.random() * 2 - 1;

          const nitroNoise = audioContext.createBufferSource();
          nitroNoise.buffer = noiseBuffer;
          nitroNoise.loop = true;
          const nitroFilter = audioContext.createBiquadFilter();
          nitroFilter.type = "bandpass";
          nitroFilter.frequency.value = 1250;
          nitroFilter.Q.value = 0.7;
          nitroGain = audioContext.createGain();
          nitroGain.gain.value = 0.0001;
          nitroNoise.connect(nitroFilter).connect(nitroGain).connect(masterGain);
          nitroNoise.start();

          nextMusicTime = audioContext.currentTime + 0.08;
        }

        audioContext.resume();
        if (soundEnabled) {
          masterGain.gain.setTargetAtTime(0.42, audioContext.currentTime, 0.03);
          updateSoundButton();
        }
      }

      function toggleSound() {
        if (!audioContext) ensureAudio();
        soundEnabled = !soundEnabled;
        const now = audioContext.currentTime;
        masterGain.gain.setTargetAtTime(soundEnabled ? 0.42 : 0.0001, now, 0.03);
        updateSoundButton();
        if (soundEnabled) {
          audioContext.resume();
          nextMusicTime = now + 0.05;
        }
      }

      function scheduleTone(frequency, time, duration, type, volume, destination = musicGain) {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, time);
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(volume, time + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);
        oscillator.connect(gain).connect(destination);
        oscillator.start(time);
        oscillator.stop(time + duration + 0.02);
      }

      function scheduleKick(time) {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(130, time);
        oscillator.frequency.exponentialRampToValueAtTime(42, time + 0.11);
        gain.gain.setValueAtTime(0.42, time);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.13);
        oscillator.connect(gain).connect(musicGain);
        oscillator.start(time);
        oscillator.stop(time + 0.14);
      }

      function scheduleNoise(time, duration, volume, frequency) {
        const source = audioContext.createBufferSource();
        const filter = audioContext.createBiquadFilter();
        const gain = audioContext.createGain();
        source.buffer = noiseBuffer;
        filter.type = "highpass";
        filter.frequency.value = frequency;
        gain.gain.setValueAtTime(volume, time);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);
        source.connect(filter).connect(gain).connect(musicGain);
        source.start(time);
        source.stop(time + duration + 0.02);
      }

      function scheduleMusicBeat(step, time) {
        const bassNotes = [40, 40, 43, 40, 47, 47, 43, 38, 40, 40, 43, 45, 47, 45, 43, 38];
        const leadNotes = [64, 67, 71, 67, 62, 67, 69, 67];
        if (step % 4 === 0) scheduleKick(time);
        if (step % 8 === 4) scheduleNoise(time, 0.1, 0.18, 1400);
        if (step % 2 === 0) {
          scheduleTone(midiToFrequency(bassNotes[step]), time, 0.16, "square", 0.09);
        }
        if (step % 2 === 1) {
          const lead = leadNotes[Math.floor(step / 2) % leadNotes.length];
          scheduleTone(midiToFrequency(lead), time, 0.075, "square", 0.035);
        }
        scheduleNoise(time, 0.025, step % 4 === 2 ? 0.045 : 0.025, 5000);
      }

      function playNitroBurst(time, volumeScale = 1) {
        scheduleTone(115, time, 0.22, "sawtooth", 0.16 * volumeScale, masterGain);
        const source = audioContext.createBufferSource();
        const filter = audioContext.createBiquadFilter();
        const gain = audioContext.createGain();
        source.buffer = noiseBuffer;
        filter.type = "highpass";
        filter.frequency.setValueAtTime(500, time);
        filter.frequency.exponentialRampToValueAtTime(2400, time + 0.18);
        gain.gain.setValueAtTime(0.22 * volumeScale, time);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.25);
        source.connect(filter).connect(gain).connect(masterGain);
        source.start(time);
        source.stop(time + 0.27);
      }

      function playFireCollectCue(count) {
        if (!audioContext || !soundEnabled) return;
        const now = audioContext.currentTime;
        scheduleTone(330 + count * 75, now, 0.09, "square", 0.085, masterGain);
        scheduleTone(440 + count * 95, now + 0.055, 0.12, "triangle", 0.065, masterGain);
      }

      function playFireNitroCue() {
        if (!audioContext || !soundEnabled) return;
        const now = audioContext.currentTime;
        scheduleTone(165, now, 0.34, "sawtooth", 0.18, masterGain);
        scheduleTone(330, now + 0.05, 0.3, "square", 0.12, masterGain);
        scheduleTone(660, now + 0.12, 0.28, "square", 0.1, masterGain);
        playNitroBurst(now, 1.35);
      }

      function playEmptyNitroCue() {
        if (!audioContext || !soundEnabled) return;
        const now = audioContext.currentTime;
        scheduleTone(92, now, 0.07, "square", 0.09, masterGain);
        scheduleTone(61, now + 0.075, 0.11, "square", 0.075, masterGain);

        const source = audioContext.createBufferSource();
        const filter = audioContext.createBiquadFilter();
        const gain = audioContext.createGain();
        source.buffer = noiseBuffer;
        filter.type = "bandpass";
        filter.frequency.value = 420;
        filter.Q.value = 1.2;
        gain.gain.setValueAtTime(0.065, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.13);
        source.connect(filter).connect(gain).connect(masterGain);
        source.start(now);
        source.stop(now + 0.14);
      }

      function playNitroReadyCue() {
        if (!audioContext || !soundEnabled) return;
        const now = audioContext.currentTime;
        scheduleTone(523.25, now, 0.16, "sine", 0.055, masterGain);
        scheduleTone(659.25, now + 0.075, 0.18, "triangle", 0.05, masterGain);
        scheduleTone(1046.5, now + 0.16, 0.28, "sine", 0.065, masterGain);
      }

      function playCountdownCue(isGo) {
        if (!audioContext || !soundEnabled) return;
        const now = audioContext.currentTime;
        scheduleTone(isGo ? 660 : 330, now, isGo ? 0.2 : 0.1, "square", 0.11, masterGain);

      function playLapCompleteCue() {
        if (!audioContext || !soundEnabled) return;
        const now = audioContext.currentTime;
        scheduleTone(523.25, now, 0.12, "square", 0.1, masterGain);
        scheduleTone(659.25, now + 0.1, 0.14, "square", 0.11, masterGain);

      }

      function playJumpCue(landing = false) {
        if (!audioContext || !soundEnabled) return;
        const now = audioContext.currentTime;
        if (landing) {
          scheduleTone(95, now, 0.12, "sawtooth", 0.09, masterGain);
          scheduleNoise(now, 0.11, 0.08, 650);
          return;
        }
        scheduleTone(180, now, 0.18, "square", 0.08, masterGain);
        scheduleTone(285, now + 0.08, 0.2, "square", 0.07, masterGain);
      }

      function updateAudio() {
        if (!audioContext || !soundEnabled) return;
        const now = audioContext.currentTime;
        while (nextMusicTime < now + 0.12) {
          scheduleMusicBeat(musicStep, nextMusicTime);
          musicStep = (musicStep + 1) % 16;
          nextMusicTime += 0.1;
        }

        const player = cars.find((car) => car.isPlayer);
        if (!player) return;
        const countdownRev = startCountdown > 0 ? Math.max(0, input.throttle) * 1.08 : 0;
        const speedRatio = Math.min(1.5, Math.max(player.speed / player.maxSpeed, countdownRev));
        const revRatio = Math.min(1.12, speedRatio);
        const engineFrequency = 46 + revRatio * 84;
        const highRevRollOff = Math.max(0, speedRatio - 0.9) * 0.01;
        const engineVolume = 0.024 + Math.min(speedRatio, 0.9) * 0.034 - highRevRollOff;
        engineOscillator.frequency.setTargetAtTime(engineFrequency, now, 0.075);
        engineSubOscillator.frequency.setTargetAtTime(engineFrequency * 0.5, now, 0.085);
        engineFilter.frequency.setTargetAtTime(300 + revRatio * 480, now, 0.08);
        engineGain.gain.setTargetAtTime(paused ? 0.004 : Math.max(0.028, engineVolume), now, 0.075);

        const nitroActive = Boolean((player.nitroActive || player.fireNitroActive) && !paused);
        const nitroVolume = player.fireNitroActive ? 0.115 : 0.075;
        nitroGain.gain.setTargetAtTime(nitroActive ? nitroVolume : 0.0001, now, nitroActive ? 0.025 : 0.08);
        if (nitroActive && !nitroWasActive) playNitroBurst(now);
        nitroWasActive = nitroActive;
      }

      function catmullRom(p0, p1, p2, p3, t) {
        const t2 = t * t;
        const t3 = t2 * t;
        return {
          x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t +
            (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
            (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
          y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t +
            (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
            (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3),
        };
      }

      function resampleClosedRoute(points, sampleCount) {
        const cumulative = [0];
        for (let index = 0; index < points.length; index += 1) {
          const next = points[(index + 1) % points.length];
          cumulative.push(cumulative[index] + Math.hypot(
            next.x - points[index].x,
            next.y - points[index].y,
          ));
        }
        const totalLength = cumulative[cumulative.length - 1];
        const samples = [];
        let segment = 0;
        for (let index = 0; index < sampleCount; index += 1) {
          const target = totalLength * index / sampleCount;
          while (segment < points.length - 1 && cumulative[segment + 1] < target) segment += 1;
          const start = points[segment];
          const end = points[(segment + 1) % points.length];
          const segmentLength = cumulative[segment + 1] - cumulative[segment];
          const blend = segmentLength > 0 ? (target - cumulative[segment]) / segmentLength : 0;
          samples.push({
            x: start.x + (end.x - start.x) * blend,
            y: start.y + (end.y - start.y) * blend,
          });
        }
        return samples;
      }

      function rebuildTrack() {
        const map = MAPS[currentMapIndex];
        const marginX = Math.max(32, viewWidth * 0.035);
        const topMargin = Math.max(94, viewHeight * 0.14);
        const bottomMargin = Math.max(34, viewHeight * 0.045);
        const usableWidth = viewWidth - marginX * 2;
        const usableHeight = Math.min(
          viewHeight - topMargin - bottomMargin,
          map.usableHeight || 720,
        );
        const points = map.controlPoints.map(([x, y]) => ({
          x: marginX + x * usableWidth,
          y: topMargin + (y - 0.12) / 0.76 * usableHeight,
        }));

        const roughTrack = [];
        for (let i = 0; i < SAMPLE_COUNT; i += 1) {
          const u = i / SAMPLE_COUNT * points.length;
          const index = Math.floor(u);
          const t = u - index;
          const p0 = points[(index - 1 + points.length) % points.length];
          const p1 = points[index % points.length];
          const p2 = points[(index + 1) % points.length];
          const p3 = points[(index + 2) % points.length];
          const point = catmullRom(p0, p1, p2, p3, t);
          roughTrack.push(point);
        }

        track = resampleClosedRoute(roughTrack, SAMPLE_COUNT);
        const originIndex = Math.round((map.progressOrigin || 0) * track.length) % track.length;
        if (originIndex) track = [...track.slice(originIndex), ...track.slice(0, originIndex)];
        let distance = 0;
        track[0].distance = 0;
        for (let index = 1; index < track.length; index += 1) {
          distance += Math.hypot(
            track[index].x - track[index - 1].x,
            track[index].y - track[index - 1].y,
          );
          track[index].distance = distance;
        }

        const closingDistance = Math.hypot(
          track[0].x - track[track.length - 1].x,
          track[0].y - track[track.length - 1].y,
        );
        trackLength = distance + closingDistance;

        for (let i = 0; i < track.length; i += 1) {
          const before = track[(i - 3 + track.length) % track.length];
          const after = track[(i + 3) % track.length];
          const angle = Math.atan2(after.y - before.y, after.x - before.x);
          track[i].angle = angle;
          track[i].nx = -Math.sin(angle);
          track[i].ny = Math.cos(angle);

          const a1 = track[(i - 7 + track.length) % track.length].angle ?? angle;
          const a2 = track[(i + 7) % track.length].angle ?? angle;
          let delta = a2 - a1;
          while (delta > Math.PI) delta -= TAU;
          while (delta < -Math.PI) delta += TAU;
          track[i].curve = Math.abs(delta);
        }

        shortcutTracks = (MAPS[currentMapIndex].shortcuts || []).map((shortcut) => {
          const start = pathAt(shortcut.from, 0);
          const end = pathAt(shortcut.to, 0);
          const via = shortcut.via.map(([x, y]) => ({
            x: marginX + x * usableWidth,
            y: topMargin + (y - 0.12) / 0.76 * usableHeight,
          }));
          return {
            ...shortcut,
            entryNormal: { x: start.nx, y: start.ny },
            samples: sampleOpenRoute([start, ...via, end]),
          };
        });
        shortcutTracks.forEach((shortcut) => {
          shortcut.pixelLength = 0;
          let entryDistance = 0;
          const routeDirection = {
            x: Math.cos(shortcut.samples[0].angle),
            y: Math.sin(shortcut.samples[0].angle),
          };
          const normalProjection = Math.max(.35, Math.abs(
            routeDirection.x * shortcut.entryNormal.x +
            routeDirection.y * shortcut.entryNormal.y,
          ));
          const gateDistance = (trackRoadWidthAt(shortcut.from) / 2 + 1) / normalProjection;
          for (let index = 1; index < shortcut.samples.length; index += 1) {
            const segmentLength = Math.hypot(
              shortcut.samples[index].x - shortcut.samples[index - 1].x,
              shortcut.samples[index].y - shortcut.samples[index - 1].y,
            );
            shortcut.pixelLength += segmentLength;
            if (shortcut.gateOpening && shortcut.gateIndex === undefined) {
              entryDistance += segmentLength;
              if (entryDistance >= gateDistance) shortcut.gateIndex = index;
            }
          }
          if (shortcut.gateOpening && Number.isFinite(shortcut.gateProgress)) {
            shortcut.gateIndex = Math.round(
              Math.max(0.2, Math.min(0.8, shortcut.gateProgress)) *
              (shortcut.samples.length - 1),
            );
          }
          shortcut.overlapRuns = findShortcutOverlapRuns(shortcut);
        });
      }

      function findShortcutOverlapRuns(shortcut) {
        if (shortcut.gateOpening) return [];
        const runs = [];
        let run = [];
        shortcut.samples.forEach((point, index) => {
          let nearestDistance = Infinity;
          let nearestTrackIndex = 0;
          for (let trackIndex = 0; trackIndex < track.length; trackIndex += 5) {
            const candidate = track[trackIndex];
            const distance = Math.hypot(point.x - candidate.x, point.y - candidate.y);
            if (distance < nearestDistance) {
              nearestDistance = distance;
              nearestTrackIndex = trackIndex;
            }
          }
          const awayFromJunctions = index > 13 && index < shortcut.samples.length - 14;
          const mainWidth = trackRoadWidthAt(nearestTrackIndex / track.length);
          const overlapsMainRoad = nearestDistance < (shortcut.width + mainWidth) / 2 - 3;
          if (awayFromJunctions && overlapsMainRoad) {
            run.push(point);
            return;
          }
          if (run.length > 1) runs.push(run);
          run = [];
        });
        if (run.length > 1) runs.push(run);
        return runs;
      }

      function sampleOpenRoute(points, sampleCount = 120) {
        const samples = [];
        const segments = points.length - 1;
        for (let index = 0; index < sampleCount; index += 1) {
          const u = index / (sampleCount - 1) * segments;
          const segment = Math.min(segments - 1, Math.floor(u));
          const t = Math.min(1, u - segment);
          const p0 = points[Math.max(0, segment - 1)];
          const p1 = points[segment];
          const p2 = points[Math.min(points.length - 1, segment + 1)];
          const p3 = points[Math.min(points.length - 1, segment + 2)];
          samples.push(catmullRom(p0, p1, p2, p3, t));
        }
        samples.forEach((point, index) => {
          const before = samples[Math.max(0, index - 2)];
          const after = samples[Math.min(samples.length - 1, index + 2)];
          point.angle = Math.atan2(after.y - before.y, after.x - before.x);
          point.nx = -Math.sin(point.angle);
          point.ny = Math.cos(point.angle);
        });
        return samples;
      }

      function distanceToTrack(x, y) {
        let minimum = Infinity;
        for (let i = 0; i < track.length; i += 10) {
          minimum = Math.min(minimum, Math.hypot(x - track[i].x, y - track[i].y));
        }
        return minimum;
      }

      function buildScenery() {
        scenerySeed = 982451653;
        sceneryObjects = [];

        for (let attempts = 0; attempts < 650 && sceneryObjects.length < 125; attempts += 1) {
          const x = 12 + seededRandom() * Math.max(1, viewWidth - 24);
          const y = 88 + seededRandom() * Math.max(1, viewHeight - 100);
          const clearance = distanceToTrack(x, y);
          if (clearance < TRACK_WIDTH / 2 + 25) continue;

          const roll = seededRandom();
          const type = roll < 0.28 ? "tree" : roll < 0.53 ? "bush" : roll < 0.76 ? "rock" : "flowers";
          sceneryObjects.push({
            x,
            y,
            type,
            scale: 0.7 + seededRandom() * 0.75,
            shade: seededRandom(),
          });
        }

      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        const scale = Math.min(window.innerWidth / GAME_WIDTH, window.innerHeight / GAME_HEIGHT);
        stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
        canvas.width = Math.round(viewWidth * dpr);
        canvas.height = Math.round(viewHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        rebuildTrack();
      }

      function pathAt(progress, laneOffset = 0) {
        const wrapped = ((progress % 1) + 1) % 1;
        const raw = wrapped * track.length;
        const index = Math.floor(raw) % track.length;
        const next = (index + 1) % track.length;
        const t = raw - Math.floor(raw);
        const a = track[index];
        const b = track[next];
        let angleDelta = b.angle - a.angle;
        while (angleDelta > Math.PI) angleDelta -= TAU;
        while (angleDelta < -Math.PI) angleDelta += TAU;
        const angle = a.angle + angleDelta * t;
        const nx = -Math.sin(angle);
        const ny = Math.cos(angle);
        return {
          x: a.x + (b.x - a.x) * t + nx * laneOffset,
          y: a.y + (b.y - a.y) * t + ny * laneOffset,
          angle,
          curve: a.curve + (b.curve - a.curve) * t,
          nx,
          ny,
        };
      }

      function pathOnSamples(samples, progress, laneOffset = 0) {
        const clamped = Math.max(0, Math.min(1, progress));
        const raw = clamped * (samples.length - 1);
        const index = Math.min(samples.length - 2, Math.floor(raw));
        const t = raw - index;
        const a = samples[index];
        const b = samples[index + 1];
        let angleDelta = b.angle - a.angle;
        while (angleDelta > Math.PI) angleDelta -= TAU;
        while (angleDelta < -Math.PI) angleDelta += TAU;
        const angle = a.angle + angleDelta * t;
        const nx = -Math.sin(angle);
        const ny = Math.cos(angle);
        return {
          x: a.x + (b.x - a.x) * t + nx * laneOffset,
          y: a.y + (b.y - a.y) * t + ny * laneOffset,
          angle,
          nx,
          ny,
          curve: 0,
        };
      }

      function trackRoadWidthAt(progress) {
        const map = MAPS[currentMapIndex];
        const wrapped = ((progress % 1) + 1) % 1;
        const baseWidth = map.trackWidth || TRACK_WIDTH;
        let weightedWidth = 0;
        let totalWeight = 0;
        let strongestBlend = 0;
        for (const section of map.widthSections || []) {
          let distance = Math.abs(wrapped - section.progress);
          distance = Math.min(distance, 1 - distance);
          if (distance >= section.span) continue;
          const blend = (1 + Math.cos(Math.PI * distance / section.span)) / 2;
          weightedWidth += section.width * blend;
          totalWeight += blend;
          strongestBlend = Math.max(strongestBlend, blend);
        }
        if (!totalWeight) return baseWidth;
        const sectionWidth = weightedWidth / totalWeight;
        return baseWidth + (sectionWidth - baseWidth) * strongestBlend;
      }

      function drivableTrackWidthAt(progress) {
        return trackRoadWidthAt(progress) + 18;
      }

      function fittedObstacleHalfWidth(obstacle) {
        if (!MAPS[currentMapIndex].bakedTrack) return obstacle.halfWidth;
        const progressSpan = obstacle.halfLength / trackLength;
        let minimumRoadWidth = Infinity;
        for (const step of [-1, -0.5, 0, 0.5, 1]) {
          minimumRoadWidth = Math.min(
            minimumRoadWidth,
            trackRoadWidthAt(obstacle.progress + progressSpan * step),
          );
        }
        const available = minimumRoadWidth / 2 - Math.abs(obstacle.lane || 0) - 6;
        return Math.max(5, Math.min(obstacle.halfWidth, available));
      }

      function fittedConstructionLane(obstacle) {
        if (!MAPS[currentMapIndex].bakedTrack) return obstacle.clearLane || 0;
        const halfWidth = fittedObstacleHalfWidth(obstacle);
        const clearHalf = obstacle.clearHalfWidth || 10;
        return Math.max(
          -halfWidth + clearHalf,
          Math.min(halfWidth - clearHalf, obstacle.clearLane || 0),
        );
      }

      function resetRace() {
        raceTime = 0;
        paused = false;
        nitroBlockedAttemptHeld = false;
        waitingForStart = true;
        startCountdown = 3;
        countdownCue = 4;
        goFlash = 0;
        finishTimer = 0;
        winner = null;
        stage.classList.add("racing");
        particles = [];
        firePickups = [];
        nextFireSpawnAt = 11 + Math.random() * 5;
        firePickupSerial = 0;
        activeCollisionPairs.clear();
        const startLaneLimit = Math.max(8, drivableTrackWidthAt(0) / 2 - BARRIER_HALF_WIDTH - 3);
        const outerLane = Math.min(18, startLaneLimit);
        const innerLane = Math.min(7, outerLane * 0.45);
        const startLanes = [-outerLane, outerLane, -innerLane, innerLane];
        const gridSpacing = 28 / trackLength;
        const startProgress = [-3 * gridSpacing, 0, -gridSpacing, -2 * gridSpacing];
        const startRanks = [4, 1, 2, 3];
        cars = CAR_COLORS.map((color, index) => {
          const spec = CAR_SPECS[index];
          const progress = startProgress[index];
          const startPosition = pathAt(progress, startLanes[index]);
          return {
            color,
            name: CAR_NAMES[index],
            progress,
            speed: 0,
            lateralSpeed: 0,
            maxSpeed: spec.maxSpeed,
            acceleration: spec.acceleration,
            handling: spec.handling,
            preferredLane: startLanes[index],
            lane: startLanes[index],
            laneTarget: startLanes[index],
            decisionTimer: 0.3 + index * 0.18,
            overtakeUntil: 0,
            bump: 0,
            barrierContact: false,
            lap: 1,
            lapTimes: [],
            lastLapTimestamp: 0,
            finished: false,
            finishTime: null,
            wobble: Math.random() * TAU,
            dustClock: Math.random() * 0.06,
            splashClock: 0,
            puddleContact: false,
            mudContact: false,
            rockyContact: false,
            rockBumpClock: 0,
            constructionContact: false,
            onIce: false,
            rampContact: false,
            airborne: false,
            height: 0,
            verticalSpeed: 0,
            rank: startRanks[index],
            isPlayer: index === 0,
            nitro: index === 0 ? 1 : 0,
            nitroRechargeDelay: 0,
            nitroActive: false,
            nitroReadyCueArmed: false,
            fireCollected: 0,
            fireNitroTimer: 0,
            fireNitroActive: false,
            burnTimer: 0,
            fireRingContact: false,
            shortcutId: null,
            shortcutProgress: 0,
            gateContact: false,
            gateRejectedUntil: 0,
            aiNitroUntil: 0,
            nextAiNitroAt: index === 0 ? Infinity : 5 + index * 0.9 + Math.random() * 3,
            x: startPosition.x,
            y: startPosition.y,
            headingAngle: startPosition.angle,
            visualAngle: startPosition.angle,
          };
        });
      }

      function selectMap(index) {
        if (index < 0 || index >= MAPS.length) return;
        currentMapIndex = index;
        activeMapImage = mapImages[index];
        mapReady = activeMapImage.complete && activeMapImage.naturalWidth > 0;
        rebuildTrack();
        resetRace();
      }

      function selectMapAtPointer(event) {
        if (!waitingForStart) return false;
        const { x: pointerX, y: pointerY } = canvasPointFromEvent(event);
        const card = mapCardRects.find((rect) =>
          pointerX >= rect.x && pointerX <= rect.x + rect.width &&
          pointerY >= rect.y && pointerY <= rect.y + rect.height
        );
        if (!card) return false;
        selectMap(card.index);
        return true;
      }

      function canvasPointFromEvent(event) {
        const bounds = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - bounds.left) * GAME_WIDTH / bounds.width,
          y: (event.clientY - bounds.top) * GAME_HEIGHT / bounds.height,
        };
      }

      function pointInsideRect(point, rect) {
        return rect && point.x >= rect.x && point.x <= rect.x + rect.width &&
          point.y >= rect.y && point.y <= rect.y + rect.height;
      }

      function startRaceAtPointer(event) {
        if (!waitingForStart || !pointInsideRect(canvasPointFromEvent(event), mapStartButtonRect)) {
          return false;
        }
        beginStartSequence();
        return true;
      }

      function returnToStartAtPointer(event) {
        if (waitingForStart || !pointInsideRect(canvasPointFromEvent(event), scoreLogoRect)) {
          return false;
        }
        resetRace();
        return true;
      }

      function beginStartSequence() {
        if (!waitingForStart) return;
        waitingForStart = false;
        startCountdown = 3;
        countdownCue = 4;
        goFlash = 0;
      }

      function updatePlayer(car, dt) {
        const steer = Math.max(-1, Math.min(1, input.steer));
        const throttle = Math.max(-1, Math.min(1, input.throttle));
        const nitroBeforeUpdate = car.nitro;
        car.fireNitroTimer = Math.max(0, car.fireNitroTimer - dt);
        car.fireNitroActive = car.fireNitroTimer > 0;
        const nitroLocked = car.nitro < NITRO_MINIMUM && !car.nitroActive;
        if (input.nitro && nitroLocked && !car.fireNitroActive && !nitroBlockedAttemptHeld) {
          playEmptyNitroCue();
          nitroBlockedAttemptHeld = true;
        } else if (!input.nitro) {
          nitroBlockedAttemptHeld = false;
        }
        const wantsNitro = input.nitro && throttle > 0.15;
        const usingNitro =
          !car.fireNitroActive && wantsNitro && car.nitro > 0.005 &&
          (car.nitroActive || car.nitro >= NITRO_MINIMUM);
        car.nitroActive = usingNitro;

        if (usingNitro) {
          car.nitro = Math.max(0, car.nitro - dt * 0.46);
          car.nitroRechargeDelay = 1.15;
          if (car.nitro < 0.995) car.nitroReadyCueArmed = true;
        } else {
          car.nitroRechargeDelay = Math.max(0, car.nitroRechargeDelay - dt);
          if (car.nitroRechargeDelay === 0) car.nitro = Math.min(1, car.nitro + dt * 0.105);
        }
        if (car.nitroReadyCueArmed && nitroBeforeUpdate < 1 && car.nitro >= 1) {
          car.nitroReadyCueArmed = false;
          playNitroReadyCue();
        }

        const activeShortcut = shortcutTracks.find((shortcut) => shortcut.id === car.shortcutId);
        const drivableWidth = activeShortcut ? activeShortcut.width + 12 : drivableTrackWidthAt(car.progress);
        const isOffRoad = Math.abs(car.lane) > drivableWidth / 2 - 6;
        const surfaceLimit = isOffRoad ? 0.62 : car.barrierContact ? 0.84 : 1;
        const boostMultiplier = car.fireNitroActive ? 1.86 : usingNitro ? 1.48 : 1;
        const topSpeed = car.maxSpeed * MAPS[currentMapIndex].speedScale * surfaceLimit * boostMultiplier;
        let targetSpeed = car.speed;
        if (car.fireNitroActive && throttle >= -0.05) {
          targetSpeed = Math.max(car.speed, topSpeed * Math.max(0.78, throttle));
        } else if (throttle > 0.05) targetSpeed = topSpeed * throttle;
        else if (throttle < -0.05) targetSpeed = 0;
        else targetSpeed = Math.max(0, car.speed - (isOffRoad ? 44 : 24) * dt);
        if (car.airborne) targetSpeed = Math.max(targetSpeed, car.speed);

        const rate = throttle < -0.05
          ? 132
          : car.acceleration * (car.fireNitroActive ? 3.15 : usingNitro ? 2.35 : 1);
        const speedDelta = targetSpeed - car.speed;
        car.speed += Math.sign(speedDelta) * Math.min(Math.abs(speedDelta), rate * dt);

        const steeringGrip = Math.min(1, car.speed / 42);
        const turnRate =
          2.25 * steeringGrip * (0.72 + car.handling * 0.28) *
          (car.airborne ? 0.3 : 1) * (car.onIce ? 0.34 : 1);
        car.headingAngle += steer * turnRate * dt;
        car.x += Math.cos(car.headingAngle) * car.speed * dt;
        car.y += Math.sin(car.headingAngle) * car.speed * dt;
        syncAndContainPlayer(car, dt);
        car.bump = Math.max(0, car.bump - dt * 5);
      }

      function shortcutGateState(shortcut) {
        const cycleTime = ((raceTime + shortcut.phase) % shortcut.cycle + shortcut.cycle) % shortcut.cycle;
        const closingFor = shortcut.closingFor || 0;
        const openingFor = shortcut.openingFor || 0;
        if (cycleTime < shortcut.openFor) return { openness: 1, phase: "open" };
        if (closingFor && cycleTime < shortcut.openFor + closingFor) {
          return {
            openness: 1 - (cycleTime - shortcut.openFor) / closingFor,
            phase: "closing",
          };
        }
        if (openingFor && cycleTime >= shortcut.cycle - openingFor) {
          return {
            openness: (cycleTime - (shortcut.cycle - openingFor)) / openingFor,
            phase: "opening",
          };
        }
        return { openness: 0, phase: "closed" };
      }

      function isShortcutGateOpen(shortcut) {
        return shortcutGateState(shortcut).phase === "open";
      }

      function circularProgressGap(a, b) {
        const gap = Math.abs(a - b);
        return Math.min(gap, 1 - gap);
      }

      function tryEnterShortcut(car) {
        const wrapped = ((car.progress % 1) + 1) % 1;
        for (const shortcut of shortcutTracks) {
          if (
            !isShortcutGateOpen(shortcut) ||
            raceTime < car.gateRejectedUntil ||
            circularProgressGap(wrapped, shortcut.from) > 0.055
          ) continue;
          const entrySampleCount = Math.ceil(shortcut.samples.length * 0.3);
          let nearestIndex = 0;
          let nearestDistance = Infinity;
          for (let index = 0; index < entrySampleCount; index += 1) {
            const point = shortcut.samples[index];
            const distance = (car.x - point.x) ** 2 + (car.y - point.y) ** 2;
            if (distance < nearestDistance) {
              nearestDistance = distance;
              nearestIndex = index;
            }
          }
          const entryLimit = shortcut.width / 2 - 3;
          const entry = shortcut.samples[0];
          const shortcutForwardX = Math.cos(entry.angle);
          const shortcutForwardY = Math.sin(entry.angle);
          const entryDepth = (car.x - entry.x) * shortcutForwardX +
            (car.y - entry.y) * shortcutForwardY;
          const headingIntoShortcut = Math.cos(car.headingAngle) * shortcutForwardX +
            Math.sin(car.headingAngle) * shortcutForwardY;
          if (
            nearestIndex < 3 ||
            nearestDistance > entryLimit ** 2 ||
            entryDepth < 4 ||
            headingIntoShortcut < 0.38
          ) continue;
          car.shortcutId = shortcut.id;
          car.shortcutProgress = nearestIndex / (shortcut.samples.length - 1);
          return true;
        }
        return false;
      }

      function syncAndContainPlayer(car, dt = 1 / 60) {
        if (!car.shortcutId) {
          syncPlayerToTrack(car);
          if (!tryEnterShortcut(car)) {
            containPlayerOnTrack(car, dt);
            return;
          }
        }

        const shortcut = shortcutTracks.find((candidate) => candidate.id === car.shortcutId);
        if (!shortcut) {
          car.shortcutId = null;
          syncPlayerToTrack(car);
          containPlayerOnTrack(car, dt);
          return;
        }

        const previousShortcutProgress = car.shortcutProgress;
        syncPlayerToShortcut(car, shortcut);
        enforceShortcutGate(car, shortcut, previousShortcutProgress);
        if (!car.shortcutId) {
          containPlayerOnTrack(car, dt);
          return;
        }
        if (car.shortcutProgress >= 0.975) {
          const lap = Math.floor(car.progress);
          car.shortcutId = null;
          car.shortcutProgress = 0;
          car.progress = lap + shortcut.to;
          syncPlayerToTrack(car);
          containPlayerOnTrack(car, dt);
          return;
        }
        containPlayerOnShortcut(car, shortcut, dt);
      }

      function enforceShortcutGate(car, shortcut, previousProgress) {
        if (isShortcutGateOpen(shortcut)) {
          car.gateContact = false;
          return;
        }
        const gateIndex = Math.min(shortcut.gateIndex || 10, shortcut.samples.length - 1);
        const gateProgress = gateIndex / (shortcut.samples.length - 1);
        const approachDistance = Math.max(0.012, (BARRIER_HALF_LENGTH + 4) / shortcut.pixelLength);
        const crossedGate = previousProgress < gateProgress && car.shortcutProgress >= gateProgress;
        const touchingGate = previousProgress <= gateProgress &&
          car.shortcutProgress >= gateProgress - approachDistance &&
          car.shortcutProgress <= gateProgress + approachDistance;
        if (!crossedGate && !touchingGate) return;

        if (shortcut.gateOpening) {
          car.shortcutId = null;
          car.gateContact = false;
          car.gateRejectedUntil = raceTime + 0.9;
          syncPlayerToTrack(car);
          const trackCenter = pathAt(car.progress, 0);
          const laneLimit = Math.max(
            12,
            drivableTrackWidthAt(car.progress) / 2 - BARRIER_HALF_WIDTH - 1.5,
          );
          car.lane = Math.max(-laneLimit, Math.min(laneLimit, car.lane));
          car.laneTarget = car.lane;
          car.x = trackCenter.x + trackCenter.nx * car.lane;
          car.y = trackCenter.y + trackCenter.ny * car.lane;
          let trackAngle = trackCenter.angle;
          if (Math.cos(car.headingAngle - trackAngle) < 0) trackAngle += Math.PI;
          car.headingAngle += Math.max(-0.18, Math.min(0.18,
            shortestAngleDifference(trackAngle, car.headingAngle)));
          car.speed = Math.max(30, Math.min(car.speed * 0.62, 62));
          car.bump = Math.max(car.bump, 0.55);
          return;
        }

        car.shortcutProgress = Math.max(0, gateProgress - approachDistance);
        const lap = Math.floor(car.progress);
        car.progress = lap + shortcut.from +
          (shortcut.to - shortcut.from) * car.shortcutProgress;
        const center = pathOnSamples(shortcut.samples, car.shortcutProgress, 0);
        const laneLimit = Math.max(7, shortcut.width / 2 - BARRIER_HALF_WIDTH - 2);
        car.lane = Math.max(-laneLimit, Math.min(laneLimit, car.lane));
        car.laneTarget = car.lane;
        car.x = center.x + center.nx * car.lane;
        car.y = center.y + center.ny * car.lane;
        car.headingAngle += Math.max(-0.06, Math.min(0.06,
          shortestAngleDifference(center.angle, car.headingAngle)));
        car.speed = Math.min(car.speed * (car.gateContact ? 0.8 : 0.32), 28);
        car.gateContact = true;
        car.bump = 1;
      }

      function syncPlayerToTrack(car) {
        let nearestProgress = 0;
        let nearestDistance = Infinity;
        const currentWrapped = ((car.progress % 1) + 1) % 1;
        const expectedIndex = Math.floor(currentWrapped * track.length);
        const searchRadius = Math.floor(track.length * 0.13);
        for (let offset = -searchRadius; offset <= searchRadius; offset += 1) {
          const index = (expectedIndex + offset + track.length) % track.length;
          const nextIndex = (index + 1) % track.length;
          const start = track[index];
          const end = track[nextIndex];
          const segmentX = end.x - start.x;
          const segmentY = end.y - start.y;
          const segmentLengthSquared = segmentX ** 2 + segmentY ** 2;
          const blend = segmentLengthSquared > 0
            ? Math.max(0, Math.min(1,
              ((car.x - start.x) * segmentX + (car.y - start.y) * segmentY) /
              segmentLengthSquared))
            : 0;
          const projectedX = start.x + segmentX * blend;
          const projectedY = start.y + segmentY * blend;
          const distance = (car.x - projectedX) ** 2 + (car.y - projectedY) ** 2;
          if (distance < nearestDistance) {
            nearestDistance = distance;
            nearestProgress = (index + blend) / track.length;
          }
        }

        const wrappedProgress = nearestProgress;
        const point = pathAt(wrappedProgress, 0);
        let lapOffset = Math.floor(car.progress);
        if (wrappedProgress - currentWrapped > 0.5) lapOffset -= 1;
        if (wrappedProgress - currentWrapped < -0.5) lapOffset += 1;
        car.progress = lapOffset + wrappedProgress;
        car.lane = (car.x - point.x) * point.nx + (car.y - point.y) * point.ny;
        car.laneTarget = car.lane;
      }

      function syncPlayerToShortcut(car, shortcut) {
        let nearestProgress = 0;
        let nearestDistance = Infinity;
        const expectedIndex = Math.round(car.shortcutProgress * (shortcut.samples.length - 1));
        const start = Math.min(shortcut.samples.length - 2, Math.max(0, expectedIndex - 24));
        const end = Math.min(shortcut.samples.length - 2, expectedIndex + 32);
        for (let index = start; index <= end; index += 1) {
          const segmentStart = shortcut.samples[index];
          const segmentEnd = shortcut.samples[index + 1];
          const segmentX = segmentEnd.x - segmentStart.x;
          const segmentY = segmentEnd.y - segmentStart.y;
          const segmentLengthSquared = segmentX ** 2 + segmentY ** 2;
          const blend = segmentLengthSquared > 0
            ? Math.max(0, Math.min(1,
              ((car.x - segmentStart.x) * segmentX + (car.y - segmentStart.y) * segmentY) /
              segmentLengthSquared))
            : 0;
          const projectedX = segmentStart.x + segmentX * blend;
          const projectedY = segmentStart.y + segmentY * blend;
          const distance = (car.x - projectedX) ** 2 + (car.y - projectedY) ** 2;
          if (distance < nearestDistance) {
            nearestDistance = distance;
            nearestProgress = (index + blend) / (shortcut.samples.length - 1);
          }
        }
        car.shortcutProgress = nearestProgress;
        const point = pathOnSamples(shortcut.samples, nearestProgress, 0);
        car.lane = (car.x - point.x) * point.nx + (car.y - point.y) * point.ny;
        car.laneTarget = car.lane;
        const lap = Math.floor(car.progress);
        car.progress = lap + shortcut.from + (shortcut.to - shortcut.from) * car.shortcutProgress;
      }

      function containPlayerOnTrack(car, dt) {
        const center = pathAt(car.progress, 0);
        containPlayerOnRoute(car, center, drivableTrackWidthAt(car.progress), dt);
      }

      function containPlayerOnShortcut(car, shortcut, dt) {
        const center = pathOnSamples(shortcut.samples, car.shortcutProgress, 0);
        const junctionDistance = Math.min(car.shortcutProgress, 1 - car.shortcutProgress);
        const junctionBlend = Math.max(0, 1 - junctionDistance / 0.18);
        const junctionRoom = trackRoadWidthAt(
          car.shortcutProgress < 0.5 ? shortcut.from : shortcut.to,
        ) * 0.55 * junctionBlend;
        containPlayerOnRoute(car, center, shortcut.width + 12 + junctionRoom, dt);
      }

      function advancePlayerWallSlide(car, distance, direction) {
        if (distance <= 0) return null;
        if (car.shortcutId) {
          const shortcut = shortcutTracks.find((candidate) => candidate.id === car.shortcutId);
          if (!shortcut) return null;
          car.shortcutProgress = Math.max(0, Math.min(1,
            car.shortcutProgress + direction * distance / shortcut.pixelLength));
          const lap = Math.floor(car.progress);
          car.progress = lap + shortcut.from +
            (shortcut.to - shortcut.from) * car.shortcutProgress;
          return pathOnSamples(shortcut.samples, car.shortcutProgress, 0);
        }

        car.progress += direction * distance / trackLength;
        return pathAt(car.progress, 0);
      }

      function containPlayerOnRoute(car, center, drivableWidth, dt) {
        const forwardX = Math.cos(car.headingAngle);
        const forwardY = Math.sin(car.headingAngle);
        const laneLimit = Math.max(12, drivableWidth / 2 - BARRIER_HALF_WIDTH - 1.5);
        const laneDistance = Math.abs(car.lane);
        const inContactBand = car.barrierContact && laneDistance > laneLimit - 1.75;
        if (laneDistance <= laneLimit && !inContactBand) {
          car.barrierContact = false;
          return;
        }

        const edgeSide = Math.sign(car.lane) || 1;
        if (laneDistance > laneLimit) {
          car.lane = edgeSide * laneLimit;
          car.laneTarget = car.lane;
          car.x = center.x + center.nx * car.lane;
          car.y = center.y + center.ny * car.lane;
        }

        const outwardX = center.nx * edgeSide;
        const outwardY = center.ny * edgeSide;
        const outwardRatio = Math.max(0, forwardX * outwardX + forwardY * outwardY);
        if (outwardRatio === 0 && laneDistance < laneLimit - 0.5) {
          car.barrierContact = false;
          return;
        }

        let tangentAngle = center.angle;
        if (Math.cos(car.headingAngle - tangentAngle) < 0) tangentAngle += Math.PI;
        const tangentTurn = shortestAngleDifference(tangentAngle, car.headingAngle);
        const alignmentRate = car.barrierContact ? 6.2 : 7.5;
        const alignment = 1 - Math.exp(-alignmentRate * dt);
        car.headingAngle += tangentTurn * alignment * (0.8 + outwardRatio * 0.2);

        const mapTopSpeed = car.maxSpeed * MAPS[currentMapIndex].speedScale;
        const scrapeRetention = car.barrierContact
          ? 0.82 - outwardRatio * 0.05
          : 0.64 - outwardRatio * 0.1;
        const scrapeSpeed = Math.max(38, mapTopSpeed * scrapeRetention);
        if (car.speed > scrapeSpeed) {
          const friction = 1 - Math.exp(-(car.barrierContact ? 3.4 : 5.1) * dt);
          car.speed += (scrapeSpeed - car.speed) * friction;
        }

        // Convert a small part of blocked outward motion into a stable slide along the wall.
        const tangentX = Math.cos(tangentAngle);
        const tangentY = Math.sin(tangentAngle);
        const tangentRatio = Math.max(0, forwardX * tangentX + forwardY * tangentY);
        const minimumSlideSpeed = Math.min(car.speed, scrapeSpeed) * 0.34;
        const slideAssist = Math.max(0, minimumSlideSpeed - car.speed * tangentRatio);
        const routeDirection = Math.cos(tangentAngle - center.angle) >= 0 ? 1 : -1;
        const slideCenter = advancePlayerWallSlide(car, slideAssist * dt, routeDirection);
        if (slideCenter) {
          car.x = slideCenter.x + slideCenter.nx * car.lane;
          car.y = slideCenter.y + slideCenter.ny * car.lane;
        }
        car.lateralSpeed *= Math.exp(-10 * dt);
        car.barrierContact = true;
        car.bump = Math.max(car.bump, inContactBand ? 0.12 : 0.4);
      }

      function updateAi(car, dt) {
        if (car.nitroActive && raceTime >= car.aiNitroUntil) {
          car.nitroActive = false;
          car.nextAiNitroAt = raceTime + 6.5 + Math.random() * 4;
        } else if (!car.nitroActive && raceTime >= car.nextAiNitroAt && car.speed > car.maxSpeed * 0.55) {
          car.nitroActive = true;
          car.aiNitroUntil = raceTime + 0.65 + Math.random() * 0.3;
          if (audioContext && soundEnabled) playNitroBurst(audioContext.currentTime, 0.28);
        }

        const player = cars.find((candidate) => candidate.isPlayer);
        const progressDeficit = player ? Math.max(0, player.progress - car.progress) : 0;
        const catchUp = Math.min(AI_CATCHUP_LIMIT, progressDeficit * 0.45);
        let targetSpeed = car.maxSpeed * MAPS[currentMapIndex].speedScale *
          AI_RACE_PACE * (1 + catchUp) * (car.nitroActive ? 1.2 : 1);
        if (car.airborne) targetSpeed = Math.max(targetSpeed, car.speed);
        car.decisionTimer -= dt;
        car.bump = Math.max(0, car.bump - dt * 5);
        const traffic = findCarAhead(car);
        if (traffic) {
          const gapPixels = traffic.gap * trackLength;
          const laneGap = Math.abs(traffic.car.lane - car.lane);
          const playerBlocking = traffic.car.isPlayer && gapPixels < 170 && laneGap < 42;
          const playerPassNeeded = playerBlocking && raceTime >= car.overtakeUntil;
          if (playerPassNeeded || (gapPixels < 145 && laneGap < 35 && car.decisionTimer <= 0)) {
            const passSide = traffic.car.lane >= 0 ? -1 : 1;
            car.laneTarget = passSide * (30 + Math.random() * 3);
            car.overtakeUntil = raceTime + 2 + Math.random() * 0.7;
            car.decisionTimer = playerPassNeeded ? 0.16 : 0.38 + Math.random() * 0.28;
          }
          if (gapPixels < 26 && laneGap < 18) {
            targetSpeed = Math.min(targetSpeed, traffic.car.speed + 18);
          }
        }

        if (raceTime > car.overtakeUntil && car.decisionTimer <= 0) {
          car.laneTarget = car.preferredLane + (Math.random() - 0.5) * 9;
          car.decisionTimer = 0.7 + Math.random();
        }

        const delta = targetSpeed - car.speed;
        const acceleration = car.acceleration * (car.nitroActive ? 1.8 : 1);
        car.speed += Math.sign(delta) * Math.min(Math.abs(delta), acceleration * dt);
      }

      function updateRampJump(car, dt, wrappedProgress) {
        const ramps = MAPS[currentMapIndex].obstacles.filter((obstacle) => obstacle.type === "ramp");
        const touchingRamp = !car.shortcutId && ramps.some((ramp) => {
          let progressGap = Math.abs(wrappedProgress - ramp.progress);
          progressGap = Math.min(progressGap, 1 - progressGap);
          return progressGap * trackLength < ramp.halfLength &&
            Math.abs(car.lane - (ramp.lane || 0)) < fittedObstacleHalfWidth(ramp);
        });

        if (touchingRamp && !car.rampContact && !car.airborne && car.speed > 45) {
          car.airborne = true;
          car.height = 1;
          car.verticalSpeed = 165;
          car.speed = Math.min(car.maxSpeed * 1.58, car.speed * 1.16 + 10);
          car.bump = 1;
          if (car.isPlayer) playJumpCue(false);
        }
        car.rampContact = touchingRamp;

        if (!car.airborne) return;
        car.height += car.verticalSpeed * dt;
        car.verticalSpeed -= 360 * dt;
        if (car.height > 0) return;

        car.height = 0;
        car.verticalSpeed = 0;
        car.airborne = false;
        car.speed *= 0.97;
        car.bump = 1;
        emitSurfaceTrail(car, wrappedProgress, Math.max(90, car.speed), 2);
        if (car.isPlayer) playJumpCue(true);
      }

      function isTouchingObstacle(car, wrappedProgress, obstacle) {
        if (car.shortcutId) return false;
        let progressGap = Math.abs(wrappedProgress - obstacle.progress);
        progressGap = Math.min(progressGap, 1 - progressGap);
        return progressGap * trackLength < obstacle.halfLength &&
          Math.abs(car.lane - (obstacle.lane || 0)) < fittedObstacleHalfWidth(obstacle);
      }

      function spawnFirePickup(player) {
        if (firePickups.length >= 1) return;
        let progress = 0;
        for (let attempt = 0; attempt < 8; attempt += 1) {
          progress = player.progress + (85 + Math.random() * 180) / trackLength;
          const wrapped = ((progress % 1) + 1) % 1;
          const clearOfObstacle = MAPS[currentMapIndex].obstacles.every((obstacle) => {
            let gap = Math.abs(wrapped - obstacle.progress);
            gap = Math.min(gap, 1 - gap);
            return gap * trackLength > obstacle.halfLength + 22;
          });
          if (clearOfObstacle) break;
        }
        const laneLimit = Math.max(7, trackRoadWidthAt(progress) / 2 - 13);
        firePickups.push({
          id: firePickupSerial++,
          progress,
          lane: (Math.random() * 2 - 1) * laneLimit,
          life: 5.5 + Math.random() * 1.5,
          maxLife: 7,
          phase: Math.random() * TAU,
        });
      }

      function triggerFireNitro(player) {
        player.fireCollected = 0;
        player.fireNitroTimer = 3.6;
        player.fireNitroActive = true;
        player.nitroActive = false;
        player.speed = Math.max(player.speed, player.maxSpeed * MAPS[currentMapIndex].speedScale * 1.18);
        playFireNitroCue();
      }

      function updateFirePickups(dt) {
        const player = cars.find((car) => car.isPlayer && !car.finished);
        if (!player) return;
        if (raceTime >= nextFireSpawnAt) {
          spawnFirePickup(player);
          nextFireSpawnAt = raceTime + 18 + Math.random() * 8;
        }

        const playerPosition = getCarPosition(player);
        for (let index = firePickups.length - 1; index >= 0; index -= 1) {
          const pickup = firePickups[index];
          pickup.life -= dt;
          const position = pathAt(pickup.progress, pickup.lane);
          if (Math.hypot(playerPosition.x - position.x, playerPosition.y - position.y) < 23) {
            firePickups.splice(index, 1);
            player.fireCollected += 1;
            const nitroBeforePickup = player.nitro;
            player.nitro = Math.min(1, player.nitro + 0.25);
            if (nitroBeforePickup < 1 && player.nitro >= 1) {
              player.nitroReadyCueArmed = false;
              playNitroReadyCue();
            }
            playFireCollectCue(player.fireCollected);
            if (player.fireCollected >= 4) triggerFireNitro(player);
            continue;
          }
          if (pickup.life <= 0) firePickups.splice(index, 1);
        }
      }

      function updateRace(dt) {
        if (waitingForStart) {
          updateParticles(dt);
          return;
        }

        if (startCountdown > 0) {
          startCountdown = Math.max(0, startCountdown - dt);
          const cue = Math.ceil(startCountdown);
          if (cue !== countdownCue) {
            countdownCue = cue;
            playCountdownCue(cue === 0);
            if (cue === 0) goFlash = 0.8;
          }
          updateParticles(dt);
          return;
        }

        goFlash = Math.max(0, goFlash - dt);
        if (winner) {
          finishTimer += dt;
          updateParticles(dt);
          return;
        } else {
          raceTime += dt;
        }

        const activeCars = cars.filter((car) => !car.finished);
        for (const car of activeCars) {
          const previousProgress = car.progress;
          if (car.isPlayer) {
            updatePlayer(car, dt);
          } else {
            updateAi(car, dt);
            car.progress += car.speed / trackLength * dt;
            const aiLaneLimit = Math.max(13, drivableTrackWidthAt(car.progress) / 2 - 15);
            car.laneTarget = Math.max(-aiLaneLimit, Math.min(aiLaneLimit, car.laneTarget));
            const desiredLateralSpeed = Math.max(-30, Math.min(30, (car.laneTarget - car.lane) * 2.15));
            car.lateralSpeed +=
              (desiredLateralSpeed - car.lateralSpeed) * Math.min(1, dt * 3.8);
            car.lane += car.lateralSpeed * dt;
            if (car.lane < -aiLaneLimit || car.lane > aiLaneLimit) {
              car.lane = Math.max(-aiLaneLimit, Math.min(aiLaneLimit, car.lane));
              car.lateralSpeed *= -0.12;
            }
          }

          const oldLap = Math.floor(Math.max(0, previousProgress)) + 1;
          const newLap = Math.floor(Math.max(0, car.progress)) + 1;
          if (newLap !== oldLap) {
            car.lap = Math.min(newLap, TOTAL_LAPS);
            if (newLap > oldLap) {
              const completedLap = newLap - 1;
              if (
                completedLap >= 1 &&
                completedLap <= TOTAL_LAPS &&
                completedLap === car.lapTimes.length + 1
              ) {
                car.lapTimes.push(raceTime - car.lastLapTimestamp);
                car.lastLapTimestamp = raceTime;
              }
              if (car.isPlayer) playLapCompleteCue();
            }
          }

          if (car.progress >= TOTAL_LAPS && !car.finished) {
            car.finished = true;
            car.nitroActive = false;
            car.finishTime = raceTime;
            car.speed = 0;
            car.lateralSpeed = 0;
            if (car.isPlayer && !winner) {
              winner = car;
              stage.classList.remove("racing");
            }
          }

          const wrappedProgress = ((car.progress % 1) + 1) % 1;
          updateRampJump(car, dt, wrappedProgress);

          car.dustClock -= dt;
          car.splashClock = Math.max(0, car.splashClock - dt);
          if (!car.airborne && car.dustClock <= 0 && car.speed > 35) {
            emitSurfaceTrail(car, wrappedProgress, car.speed);
            car.dustClock = 0.035 + Math.random() * 0.025;
          }

          const obstacles = MAPS[currentMapIndex].obstacles;
          car.burnTimer = Math.max(0, car.burnTimer - dt);
          if (car.burnTimer > 0) {
            const burningSpeed = car.maxSpeed * MAPS[currentMapIndex].speedScale * 0.68;
            car.speed = Math.min(car.speed, burningSpeed);
            car.speed = Math.max(0, car.speed - 16 * dt);
          }

          const fireRing = obstacles.find((obstacle) => obstacle.type === "fireRing");
          const touchingFireRing = Boolean(
            fireRing && !car.airborne && isTouchingObstacle(car, wrappedProgress, fireRing));
          if (touchingFireRing && !car.fireRingContact) {
            car.burnTimer = 2.8;
            car.speed *= 0.72;
            car.bump = Math.max(car.bump, 0.6);
          }
          car.fireRingContact = touchingFireRing;

          const surfacePatches = obstacles.filter((obstacle) =>
            ["puddle", "ice", "sand"].includes(obstacle.type));
          const activePatch = surfacePatches.find((obstacle) =>
            !car.airborne && isTouchingObstacle(car, wrappedProgress, obstacle));
          const touchingPatch = Boolean(activePatch);
          if (activePatch && !car.puddleContact) {
            const icy = activePatch.type === "ice";
            const sandy = activePatch.type === "sand";
            const skid = (Math.random() < 0.5 ? -1 : 1) *
              (icy ? 0.09 + Math.random() * 0.06 : 0.05 + Math.random() * 0.04);
            car.speed *= icy ? 0.92 : sandy ? 0.79 : 0.72;
            car.headingAngle += skid;
            car.lateralSpeed += Math.sign(skid) * (icy ? 10 + Math.random() * 6 : 6 + Math.random() * 4);
          }
          if (activePatch?.type === "puddle" && car.splashClock <= 0) {
            emitWaterSplash(getCarPosition(car), car.speed);
            car.splashClock = 0.09;
          }
          car.puddleContact = touchingPatch;
          car.onIce = activePatch?.type === "ice";

          const mud = obstacles.find((obstacle) => obstacle.type === "mud");
          const touchingMud = Boolean(mud && !car.airborne && isTouchingObstacle(car, wrappedProgress, mud));
          if (touchingMud) {
            if (!car.mudContact) {
              const mudSkid = (Math.random() < 0.5 ? -1 : 1) * (0.05 + Math.random() * 0.04);
              car.speed *= 0.58;
              car.headingAngle += mudSkid;
              car.lateralSpeed += Math.sign(mudSkid) * (8 + Math.random() * 5);
            }
            car.speed = Math.min(car.speed, car.maxSpeed * 0.62);
            car.speed = Math.max(0, car.speed - 45 * dt);
            if (car.splashClock <= 0) {
              emitWaterSplash(getCarPosition(car), car.speed, "mud");
              car.splashClock = 0.075;
            }
          }
          car.mudContact = touchingMud;

          const rocky = obstacles.find((obstacle) => obstacle.type === "rocky");
          const touchingRockyGround = Boolean(
            rocky && !car.airborne && isTouchingObstacle(car, wrappedProgress, rocky));
          car.rockBumpClock = Math.max(0, car.rockBumpClock - dt);
          if (touchingRockyGround) {
            if (!car.rockyContact) car.speed *= 0.82;
            if (car.rockBumpClock <= 0) {
              const rockKick = (Math.random() - 0.5) * 0.034;
              car.speed *= 0.95;
              car.headingAngle += rockKick;
              car.bump = Math.max(car.bump, 0.45);
              car.rockBumpClock = 0.11 + Math.random() * 0.08;
            }
          }
          car.rockyContact = touchingRockyGround;

          const construction = obstacles.find((obstacle) => obstacle.type === "construction");
          const touchingConstruction = Boolean(
            construction && isTouchingObstacle(car, wrappedProgress, construction));
          const onClearConstructionLine = construction &&
            Math.abs(car.lane - fittedConstructionLane(construction)) <= construction.clearHalfWidth;
          const touchingLooseConstructionDirt =
            !car.airborne && touchingConstruction && !onClearConstructionLine;
          if (touchingLooseConstructionDirt) {
            if (!car.constructionContact) car.speed *= 0.7;
            car.speed = Math.min(car.speed, car.maxSpeed * 0.76);
            car.speed = Math.max(0, car.speed - 40 * dt);
          }
          car.constructionContact = touchingLooseConstructionDirt;
        }

        updateFirePickups(dt);
        resolveCarCollisions();
        updateCarHeadings(dt);
        updateRanks();
        updateParticles(dt);
      }

      function shortestAngleDifference(target, current) {
        let difference = target - current;
        while (difference > Math.PI) difference -= TAU;
        while (difference < -Math.PI) difference += TAU;
        return difference;
      }

      function updateCarHeadings(dt) {
        for (const car of cars) {
          if (car.isPlayer) {
            const difference = shortestAngleDifference(car.headingAngle, car.visualAngle);
            const maxTurn = (2.15 + Math.min(1, car.speed / 120) * 0.55) * dt;
            car.visualAngle += Math.max(-maxTurn, Math.min(maxTurn, difference));
            continue;
          }
          const position = pathAt(car.progress, car.lane);
          const rawSlip = Math.atan2(car.lateralSpeed, Math.max(55, car.speed)) * 0.22;
          const slip = Math.max(-0.12, Math.min(0.12, rawSlip));
          const targetAngle = position.angle + slip;
          const difference = shortestAngleDifference(targetAngle, car.visualAngle);
          const maxTurn = (1.9 + Math.min(1, car.speed / 120) * 0.8) * dt;
          car.visualAngle += Math.max(-maxTurn, Math.min(maxTurn, difference));
        }
      }

      function getCarPosition(car) {
        if (!car.isPlayer) return pathAt(car.progress, car.lane);
        return {
          x: car.x,
          y: car.y,
          angle: car.visualAngle,
          nx: -Math.sin(car.visualAngle),
          ny: Math.cos(car.visualAngle),
          curve: 0,
        };
      }

      function findCarAhead(car) {
        let nearest = null;
        for (const other of cars) {
          if (other === car || other.finished) continue;
          const gap = other.progress - car.progress;
          if (gap <= 0 || gap > 0.075) continue;
          if (!nearest || gap < nearest.gap) nearest = { car: other, gap };
        }
        return nearest;
      }

      function applyWorldCorrection(car, position, dx, dy) {
        if (car.isPlayer) {
          car.x += dx;
          car.y += dy;
          syncAndContainPlayer(car);
          return;
        }
        const tangentX = Math.cos(position.angle);
        const tangentY = Math.sin(position.angle);
        const alongTrack = dx * tangentX + dy * tangentY;
        const acrossTrack = dx * position.nx + dy * position.ny;
        car.progress += alongTrack / trackLength;
        car.lane = Math.max(-33, Math.min(33, car.lane + acrossTrack));
      }

      function getCarBody(car) {
        const position = getCarPosition(car);
        const forwardX = Math.cos(position.angle);
        const forwardY = Math.sin(position.angle);
        const motionForwardX = car.isPlayer ? Math.cos(car.headingAngle) : forwardX;
        const motionForwardY = car.isPlayer ? Math.sin(car.headingAngle) : forwardY;
        return {
          car,
          position,
          forwardX,
          forwardY,
          sideX: position.nx,
          sideY: position.ny,
          motionForwardX,
          motionForwardY,
          velocityX: motionForwardX * car.speed + position.nx * (car.isPlayer ? 0 : car.lateralSpeed),
          velocityY: motionForwardY * car.speed + position.ny * (car.isPlayer ? 0 : car.lateralSpeed),
        };
      }

      function projectionRadius(body, axisX, axisY) {
        const forwardProjection = Math.abs(body.forwardX * axisX + body.forwardY * axisY);
        const sideProjection = Math.abs(body.sideX * axisX + body.sideY * axisY);
        return CAR_HALF_LENGTH * forwardProjection + CAR_HALF_WIDTH * sideProjection;
      }

      function findBodyCollision(a, b) {
        const axes = [
          [a.forwardX, a.forwardY],
          [a.sideX, a.sideY],
          [b.forwardX, b.forwardY],
          [b.sideX, b.sideY],
        ];
        const centerDX = a.position.x - b.position.x;
        const centerDY = a.position.y - b.position.y;
        let minimumOverlap = Infinity;
        let normalX = 0;
        let normalY = 0;

        for (const [axisX, axisY] of axes) {
          const signedDistance = centerDX * axisX + centerDY * axisY;
          const overlap =
            projectionRadius(a, axisX, axisY) +
            projectionRadius(b, axisX, axisY) -
            Math.abs(signedDistance);
          if (overlap <= 0) return null;
          if (overlap < minimumOverlap) {
            minimumOverlap = overlap;
            const direction = signedDistance < 0 ? -1 : 1;
            normalX = axisX * direction;
            normalY = axisY * direction;
          }
        }

        return { penetration: minimumOverlap, normalX, normalY };
      }

      function projectVelocityToCar(body, velocityX, velocityY) {
        const minimumSpeed = body.car.isPlayer ? 0 : 20;
        const playerLimit = body.car.fireNitroActive ? 1.92 : 1.55;
        const speedLimit = body.car.maxSpeed * (body.car.isPlayer ? playerLimit : 1.12);
        body.car.speed = Math.max(
          minimumSpeed,
          Math.min(
            speedLimit,
            velocityX * body.motionForwardX + velocityY * body.motionForwardY,
          ),
        );
        if (!body.car.isPlayer) {
          body.car.lateralSpeed = Math.max(
            -26,
            Math.min(26, velocityX * body.sideX + velocityY * body.sideY),
          );
        }
      }

      function applyCollisionImpulse(a, b, normalX, normalY) {
        const incomingSpeedA = a.car.speed;
        const incomingSpeedB = b.car.speed;
        let velocityAX = a.velocityX;
        let velocityAY = a.velocityY;
        let velocityBX = b.velocityX;
        let velocityBY = b.velocityY;
        const relativeNormalSpeed =
          (velocityAX - velocityBX) * normalX +
          (velocityAY - velocityBY) * normalY;

        if (relativeNormalSpeed >= 0) return;

        const inverseMassA = a.car.isPlayer ? 0.34 : 1;
        const inverseMassB = b.car.isPlayer ? 0.34 : 1;
        const inverseMassTotal = inverseMassA + inverseMassB;
        const impulse = -(1 + COLLISION_RESTITUTION) * relativeNormalSpeed / inverseMassTotal;
        velocityAX += impulse * normalX * inverseMassA;
        velocityAY += impulse * normalY * inverseMassA;
        velocityBX -= impulse * normalX * inverseMassB;
